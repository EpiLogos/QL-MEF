[package]
name = "ql-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ql"
path = "src/main.rs"

[dependencies]
ql-core = { path = "../ql-core" }
ql-semantic = { path = "../ql-semantic" }
ql-service = { path = "../ql-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
