[package]
name = "ql-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ql"
path = "src/main.rs"

[dependencies]
ql-core = { path = "../ql-core" }
ql-mef = { path = "../ql-mef" }
ql-adapters = { path = "../ql-adapters" }
ql-wiki = { path = "../ql-wiki" }
ql-semantic = { path = "../ql-semantic" }
ql-service = { path = "../ql-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
# Schema conformance only: the frozen C0 schemas are vendored verbatim and
# validated in-process, so no resolver/network features are needed.
jsonschema = { version = "0.30", default-features = false }
