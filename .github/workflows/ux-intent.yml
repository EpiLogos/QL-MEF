name: UX intent and practice
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ux-intent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check full source coverage and invalid mutations
        run: |
          set -o pipefail
          mkdir -p ux-evidence
          git rev-parse HEAD > ux-evidence/revision.txt
          python3 scripts/check-ux-publication.py | tee ux-evidence/publication-standing.json
          python3 scripts/check-ux-spine.py --self-test | tee ux-evidence/source-check.json
          bash scripts/verify-native-skills.sh
          python3 scripts/check-ux-spine.py --prepare UX01 > ux-evidence/preparation.json
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: 586b85eaf77c7232c93deb5abc75b558f15a02ed
          path: native-aikit
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native-aikit
          cache-on-failure: true
      - name: Build the pinned native Skill owner
        run: cargo build --manifest-path native-aikit/Cargo.toml --locked -p aikit-cli --bin aikit
      - name: Exercise native discovery, set, scope, current projection and disconnect
        run: python3 scripts/verify-ux-skill-projection.py --aikit native-aikit/target/debug/aikit --source-root . --output "$RUNNER_TEMP/ql-ux-delivery"
      - name: Retain bounded evidence, not model or human acceptance
        if: always()
        run: |
          mkdir -p ux-evidence
          for file in result.json commands.json source-review.json; do
            if test -f "$RUNNER_TEMP/ql-ux-delivery/$file"; then
              cp "$RUNNER_TEMP/ql-ux-delivery/$file" "ux-evidence/$file"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ql-ux-practice-evidence
          path: ux-evidence/
          retention-days: 14
