name: Pre-local build

on:
  pull_request:
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-build.yml'
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The full workspace suite (cargo test --workspace --all-targets, modulo
    # --locked) is owned canonically by ql-mef-rust.yml, which runs it on
    # every PR and on main pushes. This job keeps the `verify` check name and
    # the artifact gate (needs: verify) without re-compiling the workspace.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The full workspace suite is owned canonically by ql-mef-rust.yml; this
      # job keeps the lockfile-freshness guard and the artifact gate below.
      - run: cargo metadata --locked --format-version 1 > /dev/null

  artifact:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Package exact-main Quaternal Logic component
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          # Artifact identity derives from the product manifest, never a
          # restated version string that rots between releases.
          version="$(node -p "require('./.oi/product.json').version")"
          name="quaternal-logic-${version}-${short_sha}-component"
          mkdir -p "dist/$name"
          cp -R crates .oi "dist/$name/"
          cp Cargo.toml Cargo.lock README.md "dist/$name/"
          printf '%s\n' "$GITHUB_SHA" > "dist/$name/source-commit.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quaternal-logic-component-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
