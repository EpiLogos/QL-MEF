name: Pre-local build

# Attested component artifacts from main. ql-mef-rust.yml already gated the
# merge; this workflow does not test again.

on:
  push:
    branches: [main]
    paths:
      - '.oi/product.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - '.github/workflows/prelocal-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Package exact-main Quaternal Logic component
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          # Artifact identity derives from the product manifest, never a
          # restated version string that rots between releases.
          version="$(node -p "require('./.oi/product.json').version")"
          name="quaternal-logic-${version}-${short_sha}-component"
          mkdir -p "dist/$name"
          cp -R crates .oi "dist/$name/"
          cp Cargo.toml Cargo.lock README.md "dist/$name/"
          printf '%s\n' "$GITHUB_SHA" > "dist/$name/source-commit.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: quaternal-logic-component-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
