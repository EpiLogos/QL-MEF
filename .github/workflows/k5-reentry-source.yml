name: K5 current-main source capture (temporary)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-reentry-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 74c28d8dff899ec8dbbb020527809672e6d91e5e
          path: accepted-main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Archive tracked history and public locked compiler inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-reentry"
          git cat-file -e 74c28d8dff899ec8dbbb020527809672e6d91e5e^{commit}
          git bundle create "$RUNNER_TEMP/k5-reentry/ql-mef.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/k5-reentry/revision.txt"
          export CARGO_HOME="$RUNNER_TEMP/k5-cargo"
          cargo fetch --locked --manifest-path accepted-main/Cargo.toml
          tar -C "$CARGO_HOME" -czf "$RUNNER_TEMP/k5-reentry/registry.tar.gz" registry
      - uses: actions/upload-artifact@v4
        with:
          name: k5-reentry-source-${{ github.sha }}
          path: ${{ runner.temp }}/k5-reentry/
          retention-days: 3
          if-no-files-found: error
