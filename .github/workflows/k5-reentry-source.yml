name: K5 accepted K4 source capture (temporary)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-reentry-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked source history for the accepted join
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-reentry"
          git cat-file -e 5b24b95d17234ab5d23d84e658c0cc06434b41a3^{commit}
          git bundle create "$RUNNER_TEMP/k5-reentry/ql-mef.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/k5-reentry/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: k5-reentry-source-${{ github.sha }}
          path: ${{ runner.temp }}/k5-reentry/
          retention-days: 3
          if-no-files-found: error
