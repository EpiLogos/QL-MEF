name: QW1 compile fix

on:
  push:
    branches:
      - agent/qw1-okf-meta-wiki

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw1-okf-meta-wiki
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair temporary borrow and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/ql-wiki/tests/meta_wiki.rs')
          s = p.read_text(encoding='utf-8')
          old = '''    let [observed] = projection
        .mapped_targets("ql-mef:wiki:node:mef-l1")
        .as_slice()
    else {
        panic!("expected one mapping")
    };
'''
          new = '''    let observed_bindings = projection.mapped_targets("ql-mef:wiki:node:mef-l1");
    let [observed] = observed_bindings.as_slice() else {
        panic!("expected one mapping")
    };
'''
          assert old in s, 'expected temporary-borrow test block not found'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw1-compile-fix.yml
          git add Cargo.toml Cargo.lock crates/ql-wiki fixtures/qw1 schemas/ql-mef-meta-binding-v1.schema.json
          git commit -m "fix(#9): repair meta-wiki test lifetime and format Rust"
          git push origin HEAD:agent/qw1-okf-meta-wiki
