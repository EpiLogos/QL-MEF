name: AW181 one-shot rustfmt
on:
  push:
    branches:
      - agent/aw94-performance-acceptance
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aw94-performance-acceptance
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ql-mef/src/vak_performance.rs
          git commit -m 'chore(aw181): apply rustfmt'
          git push origin HEAD:agent/aw94-performance-acceptance
