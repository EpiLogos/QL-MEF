name: K2 branch materialization

on:
  push:
    branches: [agent/k2-recursive-m-registry]
    paths: ['.github/k2-payload.*', '.github/workflows/k2-materialize.yml']

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'EpiLogos/QL-MEF' && github.ref == 'refs/heads/agent/k2-recursive-m-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: target/k2-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: 52e7433bee54561a767833895b59f553cca62149
          path: target/k2-implementation
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore exact locally tested K2 source changes
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, subprocess
          from pathlib import Path
          parts = [Path(f'.github/k2-payload.{i}') for i in range(4)]
          payload = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(payload).hexdigest() == '9b3af2e3ab406567fce43897fdcf438a9a3367baa6d187f4e36f684275bda191'
          data = json.loads(lzma.decompress(payload))
          subprocess.run(['git', 'apply', '--check'], input=data['patch'].encode(), check=True)
          subprocess.run(['git', 'apply'], input=data['patch'].encode(), check=True)
          for path, text in data['files'].items():
              p = Path(path)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.github'
              assert not p.exists(), path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          out = Path('target/k2-materialization')
          out.mkdir(parents=True, exist_ok=True)
          paths = sorted([*data['files'], *data['modified'], 'c/registry/m-tree-source-v1.json', 'c/src/m_tree_data.inc', 'fixtures/kernel/m-tree-v1.json'])
          (out / 'paths.json').write_text(json.dumps(paths))
          (out / 'transport-sha256.txt').write_text(hashlib.sha256(payload).hexdigest() + '\n')
          subprocess.run(['git', 'rm', '--', *map(str, parts)], check=True)
          PY
      - name: Generate the registry from the exact accepted source
        run: |
          python3 scripts/compile-epi-bimba-map-live.py --source-repo target/k2-source --implementation-repo target/k2-implementation --source-lock data/epi-bimba-map/source-lock.json --out target/epi-bimba-map
          python3 scripts/generate-m-tree.py --import-compilation target/epi-bimba-map
          python3 scripts/generate-m-tree.py --check
          cargo fmt --all
      - name: Publish implementation only to the scoped branch
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          paths = json.loads(Path('target/k2-materialization/paths.json').read_text())
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert set(changed) <= set(paths), changed
          subprocess.run(['git','add','--',*paths], check=True)
          PY
          test "$(git ls-remote origin refs/heads/agent/k2-recursive-m-registry | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(kernel): implement native recursive M registry and Rust resolution parity'
          git push origin HEAD:refs/heads/agent/k2-recursive-m-registry
          git rev-parse HEAD > target/k2-materialization/head.txt
          git archive --format=tar.gz --output=target/k2-materialization/source.tar.gz HEAD
      - name: Native registry acceptance
        run: bash scripts/test-native-m-tree.sh
      - name: Rust compilation and lint
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/k2-materialization/clippy.txt
      - name: Complete Rust and native parity regression
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee target/k2-materialization/rust-tests.txt
          cmp target/m-tree/native.jsonl target/m-tree/c-rust-parity.jsonl
      - name: Return exact source and executed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k2-materialization-${{ github.run_id }}
          path: |
            target/k2-materialization/
            target/m-tree/
          if-no-files-found: error
          retention-days: 7
