name: K3 branch implementation materialization
on:
  push:
    branches: [agent/k3-m-ledger-matrix-lock]
    paths: [.github/workflows/k3-materialize.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k3-m-ledger-matrix-lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare reproducible local compiler inputs
        run: |
          cargo fetch --locked
          mkdir -p /tmp/k3-tools
          tar -C "$(rustc --print sysroot)" -czf /tmp/k3-tools/rust-toolchain.tar.gz bin lib
          tar -C "$HOME/.cargo" -czf /tmp/k3-tools/cargo-registry.tar.gz registry
          cp .github/k3-overlay.part* /tmp/k3-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: k3-local-test-inputs
          path: /tmp/k3-tools/
          retention-days: 2
      - name: Materialize only the developed K3 files
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, tarfile
          from pathlib import Path
          encoded = ''.join(Path(f'.github/k3-overlay.part{i}').read_text().strip() for i in range(3))
          encoded = encoded.replace('F3VFG5VFG5Vky', 'F3VFG5Vky')
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == '07b98213ff409626528199645f7116cd9903d6711432c0a91204c0dd528e9756', 'payload digest mismatch'
          expected = {'.github/workflows/kernel-m-ledger.yml', 'crates/ql-cli/src/m_ledger.rs', 'crates/ql-cli/tests/m_ledger_cli.rs', 'crates/ql-mef/src/m_ledger.rs', 'crates/ql-mef/tests/m_ledger.rs', 'docs/KERNEL-M-LEDGER-MATRIX-LOCK.md', 'docs/kernel-rebuild/m-ledger-v1.json', 'fixtures/kernel/m-ledger-v1.schema.json', 'scripts/m-ledger.py', 'scripts/tests/test_m_ledger.py'}
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              assert {m.name for m in archive.getmembers()} == expected
              for member in archive.getmembers():
                  assert member.isfile() and not Path(member.name).exists(), member.name
                  path = Path(member.name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.extractfile(member).read())
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, (path, old)
              p.write_text(text.replace(old, new))
          replace('crates/ql-mef/src/lib.rs', 'pub mod m_tree;', 'pub mod m_tree;\npub mod m_ledger;')
          replace('crates/ql-cli/src/lib.rs', 'pub mod vak_composition;', 'pub mod vak_composition;\npub mod m_ledger;')
          replace('crates/ql-cli/src/lib.rs', 'fn kernel_command(args: &[String], json: bool) -> Result<String, CliError> {\n    match args.first().map(String::as_str) {', 'fn kernel_command(args: &[String], json: bool) -> Result<String, CliError> {\n    match args.first().map(String::as_str) {\n        Some("coverage" | "ledger" | "validate-ledger") => m_ledger::command(args, json),')
          replace('crates/ql-cli/src/lib.rs', '            "kernel.capabilities",', '            "kernel.capabilities",\n            "kernel.coverage",\n            "kernel.ledger",\n            "kernel.validate-ledger",')
          replace('crates/ql-cli/src/lib.rs', r'Usage:\n  ql --version', r'Usage:\n  ql kernel coverage <M|M0..M5|exact-coordinate> [--stratum rust] [--axis operational] [--require verified] [--ledger path] [--json]\n  ql kernel ledger [coordinate] [--json]\n  ql kernel validate-ledger [--ledger path] [--json]\n  ql --version')
          PY
          python3 scripts/m-ledger.py refresh
          cargo fmt --all
          rm .github/k3-overlay.part* .github/workflows/k3-materialize.yml
          git add .github crates docs fixtures/kernel/m-ledger-v1.json fixtures/kernel/m-ledger-v1.schema.json scripts/m-ledger.py scripts/tests/test_m_ledger.py
          git config user.name 'Epii'
          git config user.email 'agent@epilogos.dev'
          git commit -m 'feat(kernel): implement versioned M ledger, matrix lock and native coverage (#127)'
          git push origin HEAD:agent/k3-m-ledger-matrix-lock
          git rev-parse HEAD
          git status --short
