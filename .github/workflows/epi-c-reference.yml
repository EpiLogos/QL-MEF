name: Epi C reference

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epi-c-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QL-MEF
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out locked Epi source revision
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: .source/epi
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen source identity
        run: bash scripts/sync-epi-c-reference.sh --check .source/epi

      - name: Build and run C kernel smoke
        run: bash scripts/build-epi-c-reference.sh
