name: Epi C reference

on:
  # The migration branch agent/epi-c-kernel-migration-floor was merged; the
  # frozen-corpus checks it escorted now run on main and on PRs touching the
  # vendor corpus and migration sources.
  push:
    branches:
      - main
    paths:
      - vendor/epi-kernel/reference/**
      - migration/epi-kernel/**
      - scripts/build-epi-c-reference.sh
      - scripts/sync-epi-c-reference.sh
      - .github/workflows/epi-c-reference.yml
  pull_request:
    paths:
      - vendor/epi-kernel/reference/**
      - migration/epi-kernel/**
      - scripts/build-epi-c-reference.sh
      - scripts/sync-epi-c-reference.sh
      - .github/workflows/epi-c-reference.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QL-MEF
        uses: actions/checkout@v4

      - name: Restore pinned Epi source clone
        id: epi-source-cache
        uses: actions/cache@v4
        with:
          path: .source/epi
          key: ql-epi-source-clone-daa660cbc1b8c5da83828698665a753852cb0287

      - name: Check out locked Epi source revision
        if: steps.epi-source-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: .source/epi
          fetch-depth: 1
          persist-credentials: false

      - name: Verify frozen source identity
        run: |
          chmod +x scripts/sync-epi-c-reference.sh
          scripts/sync-epi-c-reference.sh --check .source/epi

      - name: Build and run C kernel smoke
        run: |
          chmod +x scripts/build-epi-c-reference.sh
          scripts/build-epi-c-reference.sh

      # No trailing blanket workspace suite here: this conformance exercises
      # only the frozen C corpus (vendor/, migration/), no crate consumes it,
      # and the full workspace suite is owned by ql-mef-rust.yml.
