name: QL83 inherit canonical QL85 shape kernel

on:
  push:
    branches:
      - feat/epi-vak-agent-native-runtime
    paths:
      - '.github/workflows/ql83-shape-merge-probe.yml'

permissions:
  contents: write

jobs:
  merge-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epi-vak-agent-native-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Merge exact QL85 ancestry and preserve current product meaning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin agent/85-ql-shape-algebra
          set +e
          git merge --no-ff --no-commit origin/agent/85-ql-shape-algebra
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = 'README.md' || {
              printf 'unexpected merge conflicts:\n%s\n' "$conflicts"
              exit 1
            }
            git checkout --ours README.md
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          marker = '## Current development state\n'
          section = '''## Foundational executable kernel\n\nThe current executable centre is the native holographic QL kernel shared across the Rust and source-proven C bodies. Its compact human reference is [`docs/HOLOGRAPHIC-KERNEL-FORMAL-REFERENCE.md`](docs/HOLOGRAPHIC-KERNEL-FORMAL-REFERENCE.md), paired with `fixtures/kernel/holographic-kernel-contract-v1.tsv`. The same kernel now exposes the versioned `ql.shape@1.0.0` contract in `fixtures/kernel/ql-shape-contract-v1.json`: positive partial/developed wholes, A/B/C pair provenance, D1→D3 conjugate completion, D3 `4×4`, direct/conjugate `6×6`, `6 / 6′ → 6+6′` relational-generation sites and Return through the `0/1` anchor.\n\nVāk, MEF, Context Frames, SemanticWiki clients and richer harmonic development all operate or refract this same kernel field; they do not establish parallel shape vocabularies.\n\n'''
          if '## Foundational executable kernel\n' not in text:
              if marker not in text:
                  raise SystemExit('README current-development marker missing')
              text = text.replace(marker, section + marker, 1)
          path.write_text(text)
          PY
          git add README.md
          git commit -m '[QL83] Inherit canonical QL85 shape kernel beneath Vāk'
      - name: Verify merged kernel and Vāk workspace
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Remove migration workflow and push returned branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ql83-shape-merge-probe.yml
          git commit -m '[QL83] Remove shape-kernel merge migration'
          git push origin HEAD:feat/epi-vak-agent-native-runtime
