name: Q3-Q4 Hardening Verify

on:
  push:
    branches:
      - agent/rust-q4-client-adapters

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-q4-client-adapters
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/q4-clippy.log 2>&1
          status=$?
          cat /tmp/q4-clippy.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/q4-clippy.log').read_text(encoding='utf-8', errors='replace')[-12000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=QL-MEF Clippy diagnostic::{escaped}')
          PY
            exit "$status"
          fi
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Commit formatted source and verification marker
        run: |
          printf 'source_head=%s\ngates=format,check,clippy,test\nresult=passed\nconsumer=q3-revision-hardening+q4-adapters\n' "$GITHUB_SHA" > fixtures/q4/verification.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs' fixtures/q4/verification.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(q4): verify revision-preserving adapter stack'
          git push origin HEAD:agent/rust-q4-client-adapters
