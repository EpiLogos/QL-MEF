name: QW3 stale payload proof

on:
  push:
    branches:
      - agent/qw3-meta-portal

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw3-meta-portal
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Make unavailable resolver return stale material intentionally
        run: |
          sed -i '0,/payload: None,/s//payload: Some(json!({"stale": "must-not-leak"})),/' crates/ql-wiki/tests/meta_portal.rs
          cargo fmt --all
      - name: Commit proof and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw3-stale-payload-proof.yml
          git add crates/ql-wiki/tests/meta_portal.rs
          git commit -m "test(#11): prove unavailable resolver payload is discarded"
          git push origin HEAD:agent/qw3-meta-portal
