name: Cross-product (weekly)

# Every Quaternal Logic proof that reads another repository is commissioned
# here, once per week or explicitly on demand. Sibling owners gate their own
# mains; a red result here means a pin or owner seam moved, not that every QL
# pull request should rebuild the wider product field.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  frozen-runtime-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch exact frozen Factory runtime foundation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/EpiLogos/agent-system-design.git /tmp/factory
          git -C /tmp/factory checkout --detach 7690069846eb6fc89f6aa78dcf7aab886ac7c737
          test "$(git -C /tmp/factory rev-parse HEAD)" = "7690069846eb6fc89f6aa78dcf7aab886ac7c737"
      - name: Run frozen Factory foundation acceptance
        working-directory: /tmp/factory/ql-agent-experiments/foundation
        run: npm test
      - name: Verify Q5 fixture against the real frozen seam
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          fixture = json.loads(Path("fixtures/q5/runtime-refraction-v1.json").read_text())
          factory = Path("/tmp/factory")
          foundation = fixture["factoryRuntimeFoundation"]
          assert foundation["mergeCommit"] == "7690069846eb6fc89f6aa78dcf7aab886ac7c737"
          assert foundation["sourceHead"] == "9b3de175afa8f130ca97fd65e7eaff1930ba20ff"

          contract = (factory / foundation["runtimeContractPath"]).read_text()
          optics = (factory / foundation["opticsPath"]).read_text()
          seam = fixture["frozenCommonSeam"]

          for method in seam["runtimeHostMethods"]:
              assert f"'{method}'" in contract, method
          assert seam["qlOnlyCommonHostMethods"] == []
          assert "QL-MEF" not in contract
          assert "semantic closure" not in contract.lower()
          assert "execution" in optics and "semantic" in optics
          assert "not_applicable" in optics
          assert "classic" in fixture["matchedTrace"] and "ql" in fixture["matchedTrace"]
          assert fixture["integrationLaw"]["providerFailureChangesRuntimeStatus"] is False
          assert fixture["integrationLaw"]["classicRequiresQlProvider"] is False
          PY

  corrected-formal-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch exact Factory Deep QL evidence source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/EpiLogos/agent-system-design.git /tmp/factory
          git -C /tmp/factory checkout --detach a654c62f68b82236061986d9215b23257fe53b17
          test "$(git -C /tmp/factory rev-parse HEAD)" = "a654c62f68b82236061986d9215b23257fe53b17"
          test "$(git -C /tmp/factory hash-object ql-agent-experiments/deep-ql/formal/pairing-grammar.js)" = "0d6aa49197dd4d06646ea5a5fb094c03b10a74e4"
      - name: Run Factory corrected pairing evidence
        working-directory: /tmp/factory/ql-agent-experiments/deep-ql
        run: node --test test/pairing.test.js

  aw-field:
    uses: ./.github/workflows/aw-field.yml

  bimba-map:
    uses: ./.github/workflows/epi-bimba-map-conformance.yml

  epi-c-r1-r2:
    uses: ./.github/workflows/epi-c-r1-r2.yml

  epi-c-reference:
    uses: ./.github/workflows/epi-c-reference.yml

  vak-source-parity:
    uses: ./.github/workflows/epi-vak-source-parity.yml

  k8-continuous:
    uses: ./.github/workflows/kernel-k8-continuous.yml

  m2-source-parity:
    uses: ./.github/workflows/kernel-m2.yml

  m3-source-parity:
    uses: ./.github/workflows/kernel-m3-engine.yml

  kernel-source-ground:
    uses: ./.github/workflows/kernel-rebuild-source-ground.yml

  m3-native-source:
    uses: ./.github/workflows/m3-engine.yml

  ux-practice:
    uses: ./.github/workflows/ux-intent.yml
