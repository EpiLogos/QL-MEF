name: Agent-world source disposition
on:
  pull_request:
    paths:
      - '.github/workflows/agent-world-disposition.yml'
      - 'scripts/agent-world-*.py'
      - 'docs/integrations/epi-logos/**'
      - 'docs/kernel-rebuild/**'
      - 'data/epi-bimba-map/anuttara-language-map.md'
      - '.oi/product.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aw0-disposition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  complete-source-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: QL-MEF
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: original
          persist-credentials: false
          sparse-checkout: |
            Idea/Bimba/Seeds
            Idea/Bimba/Map
            Body/S
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: 75ac68f4b3912908f55c1ef0f9031d35fc694d59
          path: ai-kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Factory
          ref: c3c0677accdbeefb8e6cf1272cf45a9efa949873
          path: Factory
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 5fe7976f467096066692cda3c1018b73a88562df
          path: Central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 4af495f6509bb0dd779112a225d71a9df8145b6e
          path: Actuation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: e4e40a91fe7ed1776e634cad768f1049c39fd34e
          path: Workcell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/O-I
          ref: 4a43142a6ce9fff628e9ffe1b2d1c87ff88930a0
          path: O-I
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact subject and source-owner checkouts
        working-directory: QL-MEF
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('docs/integrations/epi-logos/agent-world-disposition.json').read_text())
          receipt = {}
          for owner, pin in manifest['repositories'].items():
              if owner == 'QL-MEF':
                  continue  # current projection source is recorded independently
              actual = subprocess.check_output(['git', '-C', '../'+owner, 'rev-parse', 'HEAD'], text=True).strip()
              if actual != pin['revision']:
                  raise SystemExit('source-owner checkout mismatch: '+owner)
              receipt[owner] = actual
          Path('evidence/owner-revisions.json').write_text(json.dumps(receipt, indent=2)+'\n')
          PY
      - name: Execute exact original property tables in a disposable consumer
        working-directory: QL-MEF
        run: python3 scripts/agent-world-property-source.py --original ../original --output evidence/property-source.json
      - name: Materialise and test every independent source inventory
        working-directory: QL-MEF
        run: |
          set -euo pipefail
          python3 scripts/agent-world-disposition.py --complete --self-test \
            --owner original=../original --owner ai-kit=../ai-kit --owner Factory=../Factory \
            --owner Central=../Central --owner Actuation=../Actuation \
            --owner Workcell=../Workcell --owner O-I=../O-I \
            --property-input evidence/property-source.json --output evidence/full-field.json \
            | tee evidence/coverage-summary.json
          python3 scripts/check-capability-matrix-registry.py | tee evidence/registry.txt
          python3 scripts/check-pre-k8-lock.py --self-test 2>&1 | tee evidence/lock.txt
          python3 scripts/check-ux-spine.py --self-test 2>&1 | tee evidence/ux-standing.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw0-full-field-${{ github.event.pull_request.head.sha || github.sha }}
          path: QL-MEF/evidence/
          retention-days: 30
