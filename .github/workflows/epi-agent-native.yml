name: Epi agent native

on:
  pull_request:
    paths:
      - 'crates/ql-mef/src/epi_agent.rs'
      - 'crates/ql-mef/src/lib.rs'
      - 'crates/ql-cli/src/epi_agent_command.rs'
      - 'crates/ql-cli/src/lib.rs'
      - 'c/registry/promotions/k9-bindings-v1.json'
      - 'fixtures/kernel/k8-census-receipt-v1.json'
      - 'docs/kernel-rebuild/m1-engine-acceptance-v1.json'
      - '.github/workflows/epi-agent-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  epi-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Native faculty unit tests
        run: |
          cargo test --locked -p ql-mef epi_agent
          cargo test --locked -p ql-cli epi_agent
      - name: Constitution and source-bound invocation smoke
        run: |
          set -euo pipefail
          cargo run --quiet --locked -p ql-cli -- epi-agent constitution --json > /tmp/constitution.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/constitution.json'))
          assert value['whole']['coordinate']=='#0/1'
          assert value['whole']['distinct_from']=='#0'
          assert value['source']['syntax_rows']==109
          assert len(value['faculties'])==6
          PY
          cat > /tmp/anuttara.json <<'JSON'
          {"schema":"ql.epi-logos-agent-invocation/v1","position":"#0","operation":"anuttara.read","input":{"reference":"M0-2-9","max_relations":128}}
          JSON
          cargo run --quiet --locked -p ql-cli -- epi-agent invoke /tmp/anuttara.json --json > /tmp/anuttara.out.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/anuttara.out.json'))
          reading=value['result']
          assert reading['language']['coordinate']=='M0-2-9'
          assert reading['bimba_node']
          assert reading['relations']
          PY
          cat > /tmp/tda.json <<'JSON'
          {"schema":"ql.epi-logos-agent-invocation/v1","position":"#1","operation":"tda.vietoris-rips","input":{"metric":"precomputed","complex":"vietoris-rips","coefficients":2,"max_homology_dimension":1,"max_scale":1.0,"distances":[[0,1,1],[1,0,1],[1,1,0]],"source_basis":{"ref":"ci:triangle","revision":"r1"}}}
          JSON
          cargo run --quiet --locked -p ql-cli -- epi-agent invoke /tmp/tda.json --json > /tmp/tda.out.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/tda.out.json'))['result']
          assert value['algorithm']=='vietoris-rips-boundary-matrix-reduction-f2'
          assert any(row['dimension']==1 for row in value['intervals'])
          PY
      - name: Rebuild current inventory receipt and disclose changed acceptance input
        run: |
          set -euo pipefail
          python3 scripts/k8-census.py --write-receipt
          echo "QL_CLI_LIB_SHA256=$(sha256sum crates/ql-cli/src/lib.rs | cut -d' ' -f1)"
          cp fixtures/kernel/k8-census-receipt-v1.json /tmp/k8-census-receipt-v1.json
      - name: Upload generated inventory receipt
        uses: actions/upload-artifact@v4
        with:
          name: epi-agent-current-inventory
          path: /tmp/k8-census-receipt-v1.json
          if-no-files-found: error
