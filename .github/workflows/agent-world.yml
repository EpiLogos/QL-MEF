name: Agent-world native acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-world.yml'
      - 'crates/**'
      - 'scripts/**'
      - 'docs/integrations/epi-logos/**'
      - 'docs/kernel-rebuild/**'
      - '.oi/product.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retained-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Exact source subject
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          rustc --version > evidence/toolchain.txt
      - name: Native property operations and retained source field
        run: |
          set -euo pipefail
          gzip -dc docs/integrations/epi-logos/aw-property-source.json.gz > evidence/original-properties.json
          cargo run --locked -p ql-mef --example property_source_check -- evidence/original-properties.json 2>&1 | tee evidence/property-coverage.txt
          python3 scripts/check-capability-matrix-registry.py | tee evidence/matrix.txt
          python3 scripts/check-pre-k8-lock.py | tee evidence/pre-k8.txt
          python3 scripts/check-ux-spine.py --self-test | tee evidence/ux.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw94-properties-${{ github.sha }}
          path: evidence/
          retention-days: 14
