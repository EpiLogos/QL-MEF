name: Finish bounded Nara source repair
on:
  push:
    branches: ['agent/nara-practice-reference-repair-20260921']
    paths: ['.github/workflows/nara-source-lint-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Repair claimed source only; retain historical K4 proof
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/nara-practice-reference-repair-20260921
          git merge-base --is-ancestor ef214b22e8964a2b48564d0ea81b0cefcd773aa3 HEAD
          mkdir -p /tmp/nara-final-repair
          git rev-parse HEAD > /tmp/nara-final-repair/base.txt
          sha256sum fixtures/kernel/m-ledger-v1.json > /tmp/nara-final-repair/historical.sha256
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('crates/ql-cli/src/nara_personal/tests.rs')
          s=p.read_text()
          assert s.count('root: &PathBuf')==2,'test helper basis changed'
          p.write_text(s.replace('root: &PathBuf','root: &std::path::Path'))
          p=Path('c/registry/promotions/k9-bindings-v1.json')
          data=json.loads(p.read_text())
          additions=[
            ('mod.rs','infrastructural',[],'Native personal CLI wire, explicit consent and identity/revision validation over existing M4 domain operations; no provider, model or public personal export authority.'),
            ('store.rs','infrastructural',[],'Owner-only native persistence, lock/revision and idempotent receipt infrastructure for the existing Nara personal domain; source references remain with Central and private records are not census evidence.'),
            ('operations.rs','coordinate-bound',['#4'],'Source-attributed operations over the existing M4 identity, embodied seven-centre, oracle, transformation, context and integration domain. Source links remain unique while distinct receipts retain performed acts; no new QL ontology or human acceptance is inferred.')
          ]
          for file,disposition,coords,rationale in additions:
            path='crates/ql-cli/src/nara_personal/'+file
            assert not any(m['path']==path for m in data['modules']),'native disposition already has another writer'
            data['modules'].append(dict(path=path,stratum='rust',disposition=disposition,coordinates=coords,rationale=rationale,tests=['crates/ql-cli/src/nara_personal/tests.rs','crates/ql-cli/tests/nara_practice_reference_reuse.rs'],kind='computational'))
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          rustfmt --edition 2024 crates/ql-cli/src/nara_personal/mod.rs crates/ql-cli/tests/nara_practice_reference_reuse.rs
          python3 scripts/k8-census.py --write-receipt > /tmp/nara-final-repair/current-inventory.log
          sha256sum --check /tmp/nara-final-repair/historical.sha256
          git diff > /tmp/nara-final-repair/patch.diff
      - name: Actual locked tests, formatting, Clippy and unchanged repository invariants
        run: |
          set -o pipefail
          cargo fmt --all --check
          cargo test --locked -p ql-cli --all-targets 2>&1 | tee /tmp/nara-final-repair/tests.log
          cargo clippy --locked -p ql-cli --all-targets -- -D warnings 2>&1 | tee /tmp/nara-final-repair/clippy.log
          bash scripts/verify invariants 2>&1 | tee /tmp/nara-final-repair/invariants.log
      - name: Commit verified source and current inventory to this dependent branch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert paths==set(['crates/ql-cli/src/nara_personal/mod.rs','crates/ql-cli/src/nara_personal/tests.rs','crates/ql-cli/tests/nara_practice_reference_reuse.rs','c/registry/promotions/k9-bindings-v1.json','fixtures/kernel/k8-census-receipt-v1.json']),paths
          subprocess.run(['git','add','--',*sorted(paths)],check=True)
          PY
          git config user.name Epii
          git config user.email noreply@openai.com
          git commit -m 'fix(nara): retain native source contracts and reviewed current owner inventory'
          test "$(git ls-remote origin refs/heads/agent/nara-practice-reference-repair-20260921 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/nara-practice-reference-repair-20260921
          git rev-parse HEAD > /tmp/nara-final-repair/head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nara-final-source-repair-${{ github.sha }}
          path: /tmp/nara-final-repair
          if-no-files-found: error
