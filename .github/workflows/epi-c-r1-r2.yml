name: Epi C R1 R2

on:
  push:
    branches:
      - agent/epi-c-r1-r2-native-floor
  pull_request:
    paths:
      - .github/workflows/epi-c-r1-r2.yml
      - scripts/characterize-epi-c-reference.sh
      - scripts/test-epi-c-parity.sh
      - migration/epi-kernel/**
      - c/**
      - vendor/epi-kernel/reference/**

jobs:
  characterize-and-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QL-MEF
        uses: actions/checkout@v4

      - name: Check out locked Epi historical tests
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: .source/epi
          fetch-depth: 1
          persist-credentials: false

      - name: Characterize full frozen C corpus
        run: |
          chmod +x scripts/characterize-epi-c-reference.sh
          scripts/characterize-epi-c-reference.sh

      - name: Run locked historical kernel test against frozen source
        run: |
          mkdir -p target/epi-c-historical-tests
          cc -std=c11 -Wall -Wextra -Werror \
            -Ivendor/epi-kernel/reference/include \
            .source/epi/Body/S/S0/epi-lib/test/engine/test_kernel.c \
            vendor/epi-kernel/reference/src/kernel.c \
            -lm -o target/epi-c-historical-tests/test_kernel
          target/epi-c-historical-tests/test_kernel | tee target/epi-c-historical-tests/test_kernel.txt

      - name: Run locked historical M1 test against frozen source
        run: |
          cc -std=c11 -Wall -Wextra \
            -Ivendor/epi-kernel/reference/include \
            .source/epi/Body/S/S0/epi-lib/test/m1/test_m1.c \
            vendor/epi-kernel/reference/src/m1.c \
            vendor/epi-kernel/reference/src/psychoid_numbers.c \
            vendor/epi-kernel/reference/src/arena.c \
            -lm -o target/epi-c-historical-tests/test_m1
          target/epi-c-historical-tests/test_m1 | tee target/epi-c-historical-tests/test_m1.txt

      - name: Build native C primitive floor and prove parity
        run: |
          chmod +x scripts/test-epi-c-parity.sh
          scripts/test-epi-c-parity.sh

      - name: Upload R1/R2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epi-c-r1-r2-evidence
          path: |
            target/epi-c-characterization
            target/epi-c-historical-tests
            target/epi-c-parity
          if-no-files-found: error

      - name: Preserve current QL-MEF package tests
        if: always()
        run: cargo test --workspace --locked
