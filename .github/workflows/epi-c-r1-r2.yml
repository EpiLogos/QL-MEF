name: Epi C R1 R2

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epi-c-r1-r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out QL-MEF
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out locked Epi historical tests
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: c7872e96a12e8253de6818876c2a039fd8082e46
          path: .source/epi
          fetch-depth: 1
          persist-credentials: false

      - name: Characterize full frozen C corpus
        run: |
          chmod +x scripts/characterize-epi-c-reference.sh
          scripts/characterize-epi-c-reference.sh

      - name: Run locked historical kernel and M1 tests against the frozen source
        shell: bash
        run: |
          mkdir -p target/epi-c-historical-tests
          REPO_ROOT=$PWD
          . scripts/epi-c-reference-lib.sh
          for test in engine/test_kernel m1/test_m1; do
            name=$(basename "$test")
            cc -std=c11 -Wall -Wextra "${EPI_C_REFERENCE_FLAGS[@]}" \
              ".source/epi/Body/S/S0/epi-lib/test/$test.c" \
              "${EPI_C_REFERENCE_SOURCES[@]}" \
              -lm -o "target/epi-c-historical-tests/$name"
            "target/epi-c-historical-tests/$name" | tee "target/epi-c-historical-tests/$name.txt"
          done

      - name: Build native C primitive floor and prove parity
        run: bash scripts/test-epi-c-parity.sh

      - name: Validate holographic coordinate manifest
        run: python3 scripts/validate-epi-holographic-manifest.py

      - name: Upload R1/R2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epi-c-r1-r2-evidence
          path: |
            target/epi-c-characterization
            target/epi-c-historical-tests
            target/epi-c-parity
          if-no-files-found: error
