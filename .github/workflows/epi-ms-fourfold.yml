name: Epi M/S fourfold conformance

on:
  pull_request:
    paths:
      - "docs/integrations/epi-logos/**"
      - "scripts/verify-epi-ms-fourfold.py"
      - "scripts/verify-epi-guardians.py"
      - "crates/ql-service/**"
      - ".github/workflows/epi-ms-fourfold.yml"
  push:
    branches:
      - main
    paths:
      - "docs/integrations/epi-logos/**"
      - "scripts/verify-epi-ms-fourfold.py"
      - "scripts/verify-epi-guardians.py"
      - "crates/ql-service/**"
      - ".github/workflows/epi-ms-fourfold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical M/S/S-prime/M-prime relation artifacts
        run: python scripts/verify-epi-ms-fourfold.py
      - name: Verify canonical guardian identity and native composition
        run: python scripts/verify-epi-guardians.py
      - name: Verify Epii native QL reading operation
        run: cargo test -p ql-service --test guardian_epii --locked
