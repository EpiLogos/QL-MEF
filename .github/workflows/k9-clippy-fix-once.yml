name: K9 one-shot Clippy repair
on:
  push:
    branches: [agent/k9-clippy-fix]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k9-clippy-fix
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Refactor focused-host receipt builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ql-mef/src/bin/ql-focused-host.rs')
          text = path.read_text()
          old = text
          text = text.replace(
              '    BimbaSelection, ClockPresentation, FocusedInstrument, FocusedInstrumentSnapshot,\n',
              '    BimbaSelection, FocusedInstrument, FocusedInstrumentSnapshot,\n',
              1,
          )
          marker = '''struct BimbaResolved {\n    config: BimbaHostEntry,\n    world: RootedMWorld,\n    selection: BimbaSelection,\n}\n'''
          insert = marker + '''\n#[derive(Default)]\nstruct ReceiptExtras {\n    owner_receipt: Option<Value>,\n    include_bimba: bool,\n    include_inspection: bool,\n}\n'''
          if marker not in text:
              raise SystemExit('BimbaResolved marker missing')
          text = text.replace(marker, insert, 1)
          signature = '''        error: Option<&str>,\n        owner_receipt: Option<Value>,\n        include_bimba: bool,\n        include_inspection: bool,\n    ) -> Value {'''
          replacement = '''        error: Option<&str>,\n        extras: ReceiptExtras,\n    ) -> Value {'''
          if signature not in text:
              raise SystemExit('receipt signature marker missing')
          text = text.replace(signature, replacement, 1)
          text = text.replace('            "owner_receipt": owner_receipt,', '            "owner_receipt": extras.owner_receipt,', 1)
          text = text.replace('        if include_bimba {', '        if extras.include_bimba {', 1)
          text = text.replace('        if include_inspection {', '        if extras.include_inspection {', 1)
          ready = '        self.receipt(None, "ready", "ready", None, None, true, false)'
          ready_replacement = '''        self.receipt(\n            None,\n            "ready",\n            "ready",\n            None,\n            ReceiptExtras {\n                include_bimba: true,\n                ..Default::default()\n            },\n        )'''
          if ready not in text:
              raise SystemExit('ready call marker missing')
          text = text.replace(ready, ready_replacement, 1)
          reject = '        self.receipt(None, "refused", "parse", Some(error), None, false, false)'
          if reject not in text:
              raise SystemExit('reject call marker missing')
          text = text.replace(
              reject,
              '        self.receipt(None, "refused", "parse", Some(error), ReceiptExtras::default())',
              1,
          )
          admission = '''            return self.receipt(\n                Some(&request_id),\n                status,\n                "admission",\n                Some(&error),\n                None,\n                false,\n                false,\n            );'''
          admission_replacement = '''            return self.receipt(\n                Some(&request_id),\n                status,\n                "admission",\n                Some(&error),\n                ReceiptExtras::default(),\n            );'''
          if admission not in text:
              raise SystemExit('admission receipt marker missing')
          text = text.replace(admission, admission_replacement, 1)
          final = '''        self.receipt(\n            Some(&request_id),\n            status,\n            operation_name,\n            error.as_deref(),\n            owner_receipt,\n            matches!(operation_name, "bimba" | "inspect"),\n            operation_name == "inspect",\n        )'''
          final_replacement = '''        self.receipt(\n            Some(&request_id),\n            status,\n            operation_name,\n            error.as_deref(),\n            ReceiptExtras {\n                owner_receipt,\n                include_bimba: matches!(operation_name, "bimba" | "inspect"),\n                include_inspection: operation_name == "inspect",\n            },\n        )'''
          if final not in text:
              raise SystemExit('final receipt marker missing')
          text = text.replace(final, final_replacement, 1)
          tests = '''mod tests {\n    use super::*;'''
          tests_replacement = '''mod tests {\n    use super::*;\n    use ql_mef::focused_instrument::ClockPresentation;'''
          if tests not in text:
              raise SystemExit('tests import marker missing')
          text = text.replace(tests, tests_replacement, 1)
          if text == old:
              raise SystemExit('no focused-host changes made')
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Prove repair under protected lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit only the focused-host repair
        run: |
          git rm .github/workflows/k9-clippy-fix-once.yml
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ql-mef/src/bin/ql-focused-host.rs
          git commit -m 'K9: satisfy focused-host protected Clippy gate'
          git push origin HEAD:agent/k9-clippy-fix
