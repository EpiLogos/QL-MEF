name: QL-MEF Rust Verify

on:
  pull_request:
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ql-mef-rust-verify.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ql-mef-rust-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
