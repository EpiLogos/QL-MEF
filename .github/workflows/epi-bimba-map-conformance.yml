name: Epi Bimba Map conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epi-bimba-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bimba-map-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out QL-MEF
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The registry's source is the committed M-tree extract of the Bimba map
      # (c/registry/m-tree-source-v1.json), written by
      # `scripts/bimba_map.py read` + `scripts/generate-m-tree.py --from-map`.
      # CI cannot reach the map; it proves the registry, C tables and Rust
      # manifest are exactly what that extract generates.
      - name: Prove the native M registry is generated from the map extract
        run: python3 scripts/generate-m-tree.py --check

      - name: Enforce the structural floor
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          m = json.loads(Path('fixtures/kernel/m-tree-v1.json').read_text())
          assert m['source_repository'] == 'bimba-map'
          assert len(m['files']) == 1 and m['files'][0]['record_class'] == 'bimba-map-read'
          assert m['files'][0]['sha256'] == m['source_revision']
          roots = Counter(n['root_position'] for n in m['nodes'] if n['root_position'] is not None)
          for root in range(6):
              assert roots[root] > 0, root
          assert roots[4] > 44
          kinds = Counter(r['source_kind'] for r in m['relations'])
          assert len(kinds) > 1
          assert sum(r['cross_m'] for r in m['relations']) > 0
          ids = {n['id'] for n in m['nodes']}
          for r in m['relations']:
              for end, ident in ((r['from_ref'], r['from_id']), (r['to_ref'], r['to_id'])):
                  assert (ident in ids) != end.startswith('bimba:'), r['relation_ref']
          print(json.dumps({'nodes': len(m['nodes']), 'relations': len(m['relations']),
                            'roots': dict(sorted(roots.items())), 'relation_kinds': len(kinds)}))
          PY
