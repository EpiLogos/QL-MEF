name: QL31 Rustfmt Once

on:
  push:
    branches:
      - agent/31-musical-harmonic-system

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/31-musical-harmonic-system
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatting when required
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ql-mef/src/lib.rs crates/ql-mef/src/music.rs crates/ql-mef/tests/musical_harmonic_system.rs
          git commit -m "style(music): rustfmt canonical derivation"
          git push origin HEAD:agent/31-musical-harmonic-system
