name: K5 parent join publication (temporary)
on:
  push:
    branches: [agent/129-parent-join-proof]
    paths: [.github/workflows/k5-parent-join-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Verify and apply exact scoped source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,subprocess,zlib
          from pathlib import Path
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='b70abb99f560d3c5161e8e8fa5577e918e07aec3eb753b1e7fa544dd284a9ad0'
          path=Path('/tmp/k5-parent-join.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          expected={'docs/KERNEL-M1-ENGINE-CONTRACT.md','crates/ql-mef/tests/m1_m2_parent_join.rs','fixtures/kernel/m-ledger-v1.json','fixtures/kernel/census/census-m1.json','fixtures/kernel/census/census-m2.json','fixtures/kernel/census/census-m3.json','fixtures/kernel/census/work-graph.json'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())==expected
          wf='.github/workflows/k5-parent-join-publish.yml'
          subprocess.run(['git','rm','--cached',wf],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='6bb8252385471dec603ceca0cdf463c2f3f9b1cc',tree
          subprocess.run(['git','reset','HEAD','--',wf],check=True)
          Path('target/parent-join').mkdir(parents=True,exist_ok=True)
          Path('target/parent-join/product-tree.txt').write_text(tree+'\n')
          PY
      - name: Test the exact product inputs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee target/parent-join/rust-tests.log
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/m-ledger.py check
          python3 scripts/m2-ledger.py check
          python3 scripts/check-m1-acceptance.py
          python3 scripts/m-ledger.py refresh
          python3 scripts/m_census.py census
          git diff --exit-code
      - name: Publish product changes only, retaining temporary workflow for connector cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(m1): prove shared M1-M2 parent handoff and document native lens encoding'
          git rev-parse HEAD > target/parent-join/published-head.txt
          git push origin HEAD:refs/heads/agent/129-parent-join-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-parent-join-${{ github.sha }}
          path: target/parent-join/
          retention-days: 14
          if-no-files-found: warn
