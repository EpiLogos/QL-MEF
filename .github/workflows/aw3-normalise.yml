name: AW3 one-shot normalise

on:
  push:
    branches:
      - agent/aw94-consumption-acceptance

permissions:
  contents: write

concurrency:
  group: aw3-one-shot-normalise
  cancel-in-progress: false

jobs:
  normalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aw94-consumption-acceptance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Apply exact accepted mechanical fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ql-mef/src/vak_thought_consumption.rs')
          text = path.read_text()
          replacements = [
              (
                  '''                recognition_evidence_refs\n                    .extend(request.performance_evidence_refs.iter().cloned());''',
                  '''                recognition_evidence_refs.extend(request.performance_evidence_refs.iter().cloned());''',
              ),
              (
                  '''        reference(\n            &input.thought_id,\n            "missing Factory RunThought identity",\n        )?;''',
                  '''        reference(&input.thought_id, "missing Factory RunThought identity")?;''',
              ),
              (
                  '''            performance_evidence_refs: with_performance\n                .then(|| BTreeSet::from([evidence.into()]))\n                .unwrap_or_default(),''',
                  '''            performance_evidence_refs: if with_performance {\n                BTreeSet::from([evidence.into()])\n            } else {\n                Default::default()\n            },''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one guarded replacement, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/aw3-normalise.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ql-mef/src/vak_thought_consumption.rs .github/workflows/aw3-normalise.yml
          git diff --cached --check
          git commit -m "AW3: normalise thought consumption acceptance"
          git push origin HEAD:agent/aw94-consumption-acceptance
