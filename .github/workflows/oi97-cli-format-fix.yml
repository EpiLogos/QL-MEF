name: OI97 CLI format fix

on:
  push:
    branches: [feat/oi97-native-cli]
    paths:
      - '.github/workflows/oi97-cli-format-fix.yml'
      - 'crates/ql-cli/src/lib.rs'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oi97-native-cli
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only the native CLI source
        run: cargo fmt -- crates/ql-cli/src/lib.rs
      - name: Commit exact formatter output and remove helper
        run: |
          rm .github/workflows/oi97-cli-format-fix.yml
          git add crates/ql-cli/src/lib.rs .github/workflows/oi97-cli-format-fix.yml
          if git diff --cached --quiet; then
            echo 'No formatter delta.'
            exit 0
          fi
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git commit -m '[OI97-CLI] Apply native Rustfmt to CLI surface'
          git push origin HEAD:feat/oi97-native-cli
