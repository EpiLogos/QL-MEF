name: K10 one-shot rustfmt

on:
  push:
    branches:
      - agent/k10-nara-full-m4
    paths:
      - ".github/workflows/k10-rustfmt.yml"
      - "crates/ql-mef/src/nara/**"

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k10-nara-full-m4
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize Rust
        run: cargo fmt --all
      - name: Commit normalization when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/ql-mef/src/nara; then
            echo "K10 Nara Rust is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ql-mef/src/nara
          git commit -m "style(nara): normalize K10 Rust with rustfmt"
          git push origin HEAD:agent/k10-nara-full-m4
