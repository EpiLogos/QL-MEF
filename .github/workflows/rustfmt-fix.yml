name: QL-MEF Rustfmt Fix

on:
  push:
    branches:
      - agent/rust-q3-provider-service

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-q3-provider-service
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted Rust
        run: |
          if git diff --quiet -- '*.rs'; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt to Q3'
          git push origin HEAD:agent/rust-q3-provider-service
