name: K7 candidate recovery
on:
  workflow_dispatch:
  push:
    branches: [agent/k7-m3-engine-131]
    paths: [.github/workflows/k7-recover-tested-tree.yml]
permissions:
  contents: write
concurrency:
  group: k7-candidate-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recover the previously uploaded candidate without replacing active work
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k7-recovery"
          receipts="$RUNNER_TEMP/k7-recovery"
          printf '%s\n' "$EXPECTED_HEAD" > "$receipts/original-head.txt"
          git config user.name 'Epii'
          git config user.email '186434782+EpiLogos@users.noreply.github.com'
          live_head=$(gh api repos/EpiLogos/QL-MEF/git/ref/heads/agent/k7-m3-engine-131 --jq .object.sha)
          test "$live_head" = "$EXPECTED_HEAD"
          # Only the known source-recovery workflow changes may intervene after
          # the last inspected engine head. Another agent's work is never replaced.
          git diff --name-only 19b6a3e9242159e192e3bcacdad4d3b141573c6c "$EXPECTED_HEAD" > "$receipts/intervening-paths.txt"
          python3 - "$receipts/intervening-paths.txt" <<'PY'
          import sys
          from pathlib import Path
          allowed = {'.github/workflows/k7-recover-tested-tree.yml', '.github/workflows/m3-engine.yml'}
          unexpected = set(Path(sys.argv[1]).read_text().splitlines()) - allowed
          if unexpected:
              raise SystemExit('Active branch changed; refusing replacement: ' + repr(sorted(unexpected)))
          PY
          candidate_tree=785083d56bb0049e3dd8d247c2a1fad209597e43
          gh api "repos/EpiLogos/QL-MEF/git/trees/$candidate_tree?recursive=1" > "$receipts/candidate-tree.json"
          python3 - "$receipts/candidate-tree.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1]))
          if value.get('truncated'):
              raise SystemExit('Candidate tree response truncated')
          paths = {item['path'] for item in value['tree']}
          required = {'Cargo.toml', 'c/src/m3.c', 'c/include/ql/m3.h',
                      'crates/ql-mef/src/m3_engine.rs', 'crates/ql-mef/tests/m3_engine.rs',
                      'docs/KERNEL-M3-ENGINE-CONTRACT.md', 'fixtures/kernel/m-ledger-v1.json',
                      'scripts/m3-observation-parity.py', 'scripts/test-m3-engine.sh'}
          missing = required - paths
          if missing:
              raise SystemExit('Uploaded candidate is incomplete; preserved without publication: ' + repr(sorted(missing)))
          PY
          candidate=$(gh api --method POST repos/EpiLogos/QL-MEF/git/commits \
            -f message='Recover retained K7 candidate for verification; not an acceptance receipt' \
            -f tree="$candidate_tree" \
            -f 'parents[]=19b6a3e9242159e192e3bcacdad4d3b141573c6c' --jq .sha)
          printf '%s\n' "$candidate" > "$receipts/recovered-commit.txt"
          git fetch origin "$candidate" main
          main=$(git rev-parse origin/main)
          printf '%s\n' "$main" > "$receipts/main.txt"
          git switch --detach "$candidate"
          # Unresolved merges abort. No ours/theirs override of K4, M1 or M2.
          git merge --no-commit --no-ff "$main"
          git checkout "$EXPECTED_HEAD" -- .github/workflows/k7-recover-tested-tree.yml
          git add .github/workflows/k7-recover-tested-tree.yml
          git write-tree > "$receipts/validated-tree-candidate.txt"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Validate the joined K4 ledger and the actual native engine
        shell: bash
        run: |
          set -euo pipefail
          receipts="$RUNNER_TEMP/k7-recovery"
          python3 scripts/m-ledger.py check 2>&1 | tee "$receipts/ledger.txt"
          python3 scripts/check-capability-matrix-registry.py 2>&1 | tee "$receipts/matrix-lock.txt"
          bash scripts/test-m3-engine.sh 2>&1 | tee "$receipts/native-tests.txt"
          cargo test --workspace --all-targets --locked 2>&1 | tee "$receipts/workspace-tests.txt"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$receipts/clippy.txt"
          cargo fmt --all -- --check 2>&1 | tee "$receipts/format.txt"
          cargo run -q -p ql-cli --locked -- kernel validate-ledger --json > "$receipts/native-ledger.json"
          python3 scripts/m_census.py census 2>&1 | tee "$receipts/census.txt"
          python3 scripts/m-ledger.py refresh 2>&1 | tee "$receipts/refresh.txt"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$receipts/validated-tree-candidate.txt")"
      - name: Publish the validated continuation only to the existing work branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          receipts="$RUNNER_TEMP/k7-recovery"
          live_head=$(gh api repos/EpiLogos/QL-MEF/git/ref/heads/agent/k7-m3-engine-131 --jq .object.sha)
          test "$live_head" = "$EXPECTED_HEAD"
          main=$(cat "$receipts/main.txt")
          live_main=$(gh api repos/EpiLogos/QL-MEF/git/ref/heads/main --jq .object.sha)
          test "$live_main" = "$main"
          tree=$(git write-tree)
          commit=$(gh api --method POST repos/EpiLogos/QL-MEF/git/commits \
            -f message='feat(m3): recover validated full K7 continuation over accepted K4 and current main' \
            -f tree="$tree" -f "parents[]=$EXPECTED_HEAD" -f "parents[]=$main" --jq .sha)
          gh api --method PATCH repos/EpiLogos/QL-MEF/git/refs/heads/agent/k7-m3-engine-131 \
            -f sha="$commit" -F force=false > "$receipts/ref-update.json"
          printf '%s\n' "$commit" > "$receipts/published-commit.txt"
          # No protected-main write, PR merge, source promotion or issue closure.
          # Final source-observer and PR acceptance remain separately inspectable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k7-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/k7-recovery/
          retention-days: 14
          if-no-files-found: error
