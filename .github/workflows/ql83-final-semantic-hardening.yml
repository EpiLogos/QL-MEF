name: QL83 final Vāk semantic-boundary acceptance

on:
  push:
    branches:
      - feat/epi-vak-agent-native-runtime
    paths:
      - '.github/workflows/ql83-final-semantic-hardening.yml'
      - 'scripts/ql83-final-semantic-hardening.py'
      - 'scripts/ql83-final-semantic-fix.py'

permissions:
  contents: write

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QL-MEF branch
        uses: actions/checkout@v4
        with:
          ref: feat/epi-vak-agent-native-runtime
          path: ql-mef
          fetch-depth: 0

      - name: Checkout exact accepted AIKit operative owner
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: 4e35f499c50b987551ab124b4432757973e823ae
          path: aikit-owner

      - name: Checkout exact Factory Action owner
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/agent-system-design
          ref: 71287c179e7686cb37cb25267958f0c390a1ecb7
          path: factory-owner

      - name: Checkout exact Central Action owner
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 77625f40081a3e38503d732f44c607a94888d9d6
          path: central-owner

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply final semantic-boundary hardening
        working-directory: ql-mef
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ql83-final-semantic-hardening.py
          python3 scripts/ql83-final-semantic-fix.py

      - name: Prove exact expressions are AIKit-owned AST/render/path identities
        working-directory: aikit-owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4e35f499c50b987551ab124b4432757973e823ae'
          cat > crates/aikit-core/tests/ql83_vak_bridge.rs <<'RS'
          use aikit_core::resource::{parse_resolve_expression, resolve_path_identity};

          #[test]
          fn ql83_vak_bridge_uses_the_same_general_resolve_expression_objects() {
              for (raw, expected_identity) in [
                  ("@2 candidate / @5 request-evidence", "resolve-path:87fc6f42f239f59b"),
                  ("@4 Central/Work x @3 work.list", "resolve-path:a8d70c5d3fef7c90"),
              ] {
                  let expression = parse_resolve_expression(raw).unwrap();
                  assert_eq!(expression.render(), raw);
                  assert_eq!(resolve_path_identity(&expression), expected_identity);
              }
          }
          RS
          cargo test -p aikit-core --test ql83_vak_bridge -- --exact ql83_vak_bridge_uses_the_same_general_resolve_expression_objects
          rm crates/aikit-core/tests/ql83_vak_bridge.rs

      - name: Re-execute exact native Action specimens
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C factory-owner rev-parse HEAD)" = '71287c179e7686cb37cb25267958f0c390a1ecb7'
          cargo test --manifest-path factory-owner/Cargo.toml -p epilogos-factory --test build_file_provider local_provider_persists_canonical_mutation_and_reopens_at_new_revision -- --exact
          test "$(git -C central-owner rev-parse HEAD)" = '77625f40081a3e38503d732f44c607a94888d9d6'
          cargo test --manifest-path central-owner/Cargo.toml -p ctrl --test port_connector work_list_action_depends_on_port_and_reports_selected_connector -- --exact

      - name: Verify complete QL-MEF/Vāk workspace
        working-directory: ql-mef
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Admit same-run expression/Action evidence into Vāk path and M5 praxis return
        working-directory: ql-mef
        shell: bash
        env:
          VAK_OWNER_CONFORMANCE_RUN_REF: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cargo test -p ql-mef --test vak_oi_runtime native_owner_conformance_can_return_through_vak_path_and_m5_recognition -- --exact

      - name: Commit accepted runtime and retire migration scaffolding
        working-directory: ql-mef
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ql83-final-semantic-hardening.yml scripts/ql83-final-semantic-hardening.py scripts/ql83-final-semantic-fix.py
          git add crates/ql-mef/src/vak_oi.rs crates/ql-mef/src/lib.rs crates/ql-mef/tests/vak_oi_runtime.rs
          git commit -m '[QL83] Close expression ownership and observed praxis return'
          git push origin HEAD:feat/epi-vak-agent-native-runtime
