name: QW2 export provider

on:
  push:
    branches:
      - agent/qw2-wiki-refraction-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw2-wiki-refraction-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Export registry provider
        run: |
          sed -i '/^mod refraction;$/a mod registry_provider;' crates/ql-wiki/src/lib.rs
          sed -i '/^pub use refraction::{/i pub use registry_provider::RegistryDisclosureProvider;' crates/ql-wiki/src/lib.rs
          cargo fmt --all
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw2-export-provider.yml
          git add crates/ql-wiki
          git commit -m "feat(#10): export and format Wiki refraction provider"
          git push origin HEAD:agent/qw2-wiki-refraction-contract
