name: K5 checked face correction (temporary)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-face-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    if: github.ref == 'refs/heads/agent/129-m1-coordinate-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify and apply exact reviewed correction
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-correction"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '47c70715215c310bddc673ee262018b7d3557b1102cd23653b44b6591d78a216'
          assert b'diff --git a/.github/' not in patch
          Path(os.environ['RUNNER_TEMP'], 'k5-correction', 'correction.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/k5-correction/correction.patch"
          git apply --index "$RUNNER_TEMP/k5-correction/correction.patch"
          git rm .github/workflows/k5-face-correction.yml
      - name: Execute corrected full workspace and ledger
        run: |
          set -euo pipefail
          python3 -m pip install jsonschema==4.25.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/k5-correction/workspace-tests.txt"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$RUNNER_TEMP/k5-correction/clippy.txt"
          python3 scripts/m-ledger.py check
          python3 -m unittest discover -s scripts/tests -p test_m_ledger.py -v 2>&1 | tee "$RUNNER_TEMP/k5-correction/ledger-python.txt"
          git diff --exit-code
      - name: Publish corrected product only to K5 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(m1): project completion onto actual walker face and renew parity evidence'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/agent/129-m1-coordinate-rebuild
          git rev-parse HEAD > "$RUNNER_TEMP/k5-correction/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/k5-correction/tree.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-face-correction-${{ github.sha }}
          path: ${{ runner.temp }}/k5-correction/
          retention-days: 7
          if-no-files-found: error
