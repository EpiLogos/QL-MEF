name: Q3 Revision Backport

on:
  push:
    branches:
      - agent/rust-q3-provider-service

permissions:
  contents: write

jobs:
  backport:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-q3-provider-service
          fetch-depth: 0
      - name: Fetch stacked Q4 source
        run: git fetch origin agent/rust-q4-client-adapters
      - name: Copy Q3-owned hardening only
        run: |
          git checkout origin/agent/rust-q4-client-adapters -- \
            crates/ql-semantic/src/request.rs \
            crates/ql-semantic/src/lib.rs \
            crates/ql-service/tests/support/mod.rs \
            crates/ql-service/tests/provider_service.rs \
            schemas/q3/service.schema.json \
            docs/Q3-PROVIDER-SERVICE.md
          git checkout origin/agent/rust-q4-client-adapters -- crates/ql-service/tests/revision_contract.rs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Commit verified Q3 hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/ql-semantic crates/ql-service/tests schemas/q3/service.schema.json docs/Q3-PROVIDER-SERVICE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(q3): preserve caller revisions through provider boundary'
          git push origin HEAD:agent/rust-q3-provider-service
