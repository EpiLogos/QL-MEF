name: Nara native personal operations
# Supplementary exact-source diagnostic; ql-mef-rust.yml owns PR acceptance.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Test the committed native source, never repair it inside the test
        run: |
          set -o pipefail
          mkdir -p /tmp/nara-native
          git rev-parse HEAD > /tmp/nara-native/source-revision.txt
          cargo test --locked -p ql-cli --all-targets 2>&1 | tee /tmp/nara-native/tests.log
      - name: Lint and format exact source
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p ql-cli --all-targets -- -D warnings
      - name: Build exact native executable
        if: ${{ !cancelled() }}
        run: |
          SUITE_BUILD_REVISION=$(git rev-parse HEAD) cargo build --locked -p ql-cli --bin ql
          cp target/debug/ql /tmp/nara-native/
          git diff --exit-code
          sha256sum /tmp/nara-native/ql > /tmp/nara-native/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nara-native-${{ github.sha }}
          path: /tmp/nara-native
          retention-days: 3
