name: Nara native identity material intake
on:
  push:
    branches: ['agent/nara-native-identity-material-20260921']
    paths: ['.github/workflows/nara-identity-material-intake.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Join the previously verified registration and repair borrowed test paths
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/nara-native-identity-material-20260921
          mkdir -p /tmp/nara-identity
          git rev-parse HEAD > /tmp/nara-identity/source-head.txt
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          # Replay the exact registration which passed all 70 native tests.
          source=subprocess.check_output(['git','show','ce5572cc8727678c911131a5f17d1f7ce1246258:.github/workflows/nara-identity-material-intake.yml'],text=True)
          begin=source.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=source.index('\n          PY',begin)
          code='\n'.join(line[10:] for line in source[begin:end].splitlines())
          exec(compile(code,'verified-native-registration','exec'))
          for name in ['tests.rs','identity_material_tests.rs']:
              p=Path('crates/ql-cli/src/nara_personal')/name
              s=p.read_text()
              assert 'root: &PathBuf' in s
              p.write_text(s.replace('root: &PathBuf','root: &std::path::Path'))
          PY
          rustfmt --edition 2021 crates/ql-cli/src/nara_personal/mod.rs crates/ql-cli/src/nara_personal/identity_material_tests.rs
      - name: Native regression and complete CLI suite
        run: |
          set -euo pipefail
          cargo test --locked -p ql-cli --all-targets 2>&1 | tee /tmp/nara-identity/tests.log
          cargo clippy --locked -p ql-cli --all-targets -- -D warnings 2>&1 | tee /tmp/nara-identity/clippy.log
      - name: Publish tested code only on this dependent branch
        run: |
          set -euo pipefail
          git add crates/ql-cli/src/nara_personal
          git diff --cached > /tmp/nara-identity/implemented.patch
          git config user.name Epii
          git config user.email noreply@openai.com
          git commit -m 'feat(nara): expose consented native identity material and invalidate stale identity derivatives'
          test "$(git ls-remote origin refs/heads/agent/nara-native-identity-material-20260921 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/nara-native-identity-material-20260921
          git rev-parse HEAD > /tmp/nara-identity/implemented-head.txt
      - name: Preserve exact native source and public controlled evidence
        if: always()
        run: |
          tar -czf /tmp/nara-identity/native-source.tar.gz crates/ql-cli/src/nara_personal
          if test -x target/debug/ql; then cp target/debug/ql /tmp/nara-identity/ql; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nara-native-identity-${{ github.sha }}
          path: /tmp/nara-identity
          retention-days: 3
          if-no-files-found: error
