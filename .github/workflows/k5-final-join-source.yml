name: K5 final join source (temporary)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-final-join-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture exact tracked repository history
        run: |
          set -euo pipefail
          git cat-file -e 81764a8d434ccb65182d86543cc031686177b8af^{commit}
          git cat-file -e 7dda4d8c9c708d0e551fb19fada4097168c8af30^{commit}
          mkdir -p "$RUNNER_TEMP/k5-final-join"
          git bundle create "$RUNNER_TEMP/k5-final-join/ql-mef.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/k5-final-join/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: k5-final-join-${{ github.sha }}
          path: ${{ runner.temp }}/k5-final-join/
          retention-days: 3
          if-no-files-found: error
