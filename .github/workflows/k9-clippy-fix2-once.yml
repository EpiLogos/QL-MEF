name: K9 census-neutral Clippy repair
on:
  push:
    branches: [agent/k9-clippy-fix2]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k9-clippy-fix2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Derive disclosure from the receipt operation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ql-mef/src/bin/ql-focused-host.rs')
          text = path.read_text()
          text = text.replace(
              '    BimbaSelection, ClockPresentation, FocusedInstrument, FocusedInstrumentSnapshot,\n',
              '    BimbaSelection, FocusedInstrument, FocusedInstrumentSnapshot,\n',
              1,
          )
          signature = '''        error: Option<&str>,\n        owner_receipt: Option<Value>,\n        include_bimba: bool,\n        include_inspection: bool,\n    ) -> Value {'''
          replacement = '''        error: Option<&str>,\n        owner_receipt: Option<Value>,\n    ) -> Value {'''
          if signature not in text:
              raise SystemExit('receipt signature marker missing')
          text = text.replace(signature, replacement, 1)
          text = text.replace('        if include_bimba {', '        if matches!(operation, "ready" | "bimba" | "inspect") {', 1)
          text = text.replace('        if include_inspection {', '        if operation == "inspect" {', 1)
          text = text.replace('        self.receipt(None, "ready", "ready", None, None, true, false)', '        self.receipt(None, "ready", "ready", None, None)', 1)
          text = text.replace('        self.receipt(None, "refused", "parse", Some(error), None, false, false)', '        self.receipt(None, "refused", "parse", Some(error), None)', 1)
          admission = '''            return self.receipt(\n                Some(&request_id),\n                status,\n                "admission",\n                Some(&error),\n                None,\n                false,\n                false,\n            );'''
          admission_replacement = '''            return self.receipt(\n                Some(&request_id),\n                status,\n                "admission",\n                Some(&error),\n                None,\n            );'''
          if admission not in text:
              raise SystemExit('admission receipt marker missing')
          text = text.replace(admission, admission_replacement, 1)
          final = '''        self.receipt(\n            Some(&request_id),\n            status,\n            operation_name,\n            error.as_deref(),\n            owner_receipt,\n            matches!(operation_name, "bimba" | "inspect"),\n            operation_name == "inspect",\n        )'''
          final_replacement = '''        self.receipt(\n            Some(&request_id),\n            status,\n            operation_name,\n            error.as_deref(),\n            owner_receipt,\n        )'''
          if final not in text:
              raise SystemExit('final receipt marker missing')
          text = text.replace(final, final_replacement, 1)
          tests = '''mod tests {\n    use super::*;'''
          tests_replacement = '''mod tests {\n    use super::*;\n    use ql_mef::focused_instrument::ClockPresentation;'''
          if tests not in text:
              raise SystemExit('tests import marker missing')
          text = text.replace(tests, tests_replacement, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Prove protected lint locally
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit only census-neutral source repair
        run: |
          git rm .github/workflows/k9-clippy-fix2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ql-mef/src/bin/ql-focused-host.rs
          git commit -m 'K9: satisfy focused-host protected Clippy gate'
          git push origin HEAD:agent/k9-clippy-fix2
