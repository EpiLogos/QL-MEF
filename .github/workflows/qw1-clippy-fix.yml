name: QW1 clippy fix

on:
  push:
    branches:
      - agent/qw1-okf-meta-wiki

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw1-okf-meta-wiki
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply clippy recommendation and rustfmt
        run: |
          sed -i 's/&\[binding.clone()\]/std::slice::from_ref(\&binding)/g' crates/ql-wiki/tests/meta_wiki.rs
          cargo fmt --all
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw1-clippy-fix.yml
          git add crates/ql-wiki/tests/meta_wiki.rs crates/ql-wiki/tests/foreign_interop.rs
          git commit -m "fix(#9): satisfy clippy in meta-wiki acceptance"
          git push origin HEAD:agent/qw1-okf-meta-wiki
