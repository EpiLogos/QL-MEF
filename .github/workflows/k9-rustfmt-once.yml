name: K9 one-shot rustfmt
on:
  push:
    branches: [agent/k9-focused-instrument]
    paths:
      - 'crates/ql-mef/src/bin/ql-focused-host.rs'
      - 'crates/ql-mef/src/focused_instrument_aw2.rs'
      - '.github/workflows/k9-rustfmt-once.yml'
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k9-focused-instrument
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical workspace formatting
        run: |
          cargo fmt --all
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'crates/ql-mef/src/bin/ql-focused-host.rs\ncrates/ql-mef/src/focused_instrument_aw2.rs' || {
            echo 'rustfmt changed an unexpected file set' >&2
            exit 1
          }
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ql-mef/src/bin/ql-focused-host.rs crates/ql-mef/src/focused_instrument_aw2.rs
          git commit -m 'K9: apply canonical rustfmt'
          git push origin HEAD:agent/k9-focused-instrument
