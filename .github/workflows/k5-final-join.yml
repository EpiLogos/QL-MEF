name: K5 final exact-tree join (temporary)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-final-join.yml]
permissions:
  contents: write
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: target/m2-bimba-source
          sparse-checkout: |
            Idea/Bimba/Map/datasets
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Join pinned published engines without replacing either ledger
        run: |
          set -euo pipefail
          mkdir -p target/k5-final-join
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 7dda4d8c9c708d0e551fb19fada4097168c8af30 || test -f .git/MERGE_HEAD
          test "$(git rev-parse MERGE_HEAD)" = 7dda4d8c9c708d0e551fb19fada4097168c8af30
          python3 scripts/_k5_final_join.py > target/k5-final-join/reconciliation.txt
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Both native engines, source parity, sanitizers and installed clients
        run: |
          set -euo pipefail
          bash scripts/test-m1-engine.sh > target/k5-final-join/native-m1.txt 2>&1
          bash scripts/test-m2-engine.sh > target/k5-final-join/native-m2.txt 2>&1
          python3 scripts/m2-ledger.py refresh > target/k5-final-join/ledger.txt
          python3 scripts/m-ledger.py refresh >> target/k5-final-join/ledger.txt
          python3 scripts/m_census.py census >> target/k5-final-join/ledger.txt
          git add -A
      - name: Exact joined workspace and generator acceptance
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked > target/k5-final-join/workspace-tests.txt 2>&1
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings > target/k5-final-join/clippy.txt 2>&1
          python3 -m unittest discover -s scripts/tests -p 'test_m*.py' -v > target/k5-final-join/python-tests.txt 2>&1
          python3 scripts/m-ledger.py check >> target/k5-final-join/ledger.txt
          python3 scripts/m2-ledger.py check >> target/k5-final-join/ledger.txt
          python3 scripts/check-m1-acceptance.py >> target/k5-final-join/ledger.txt
          python3 scripts/m-ledger.py refresh >> target/k5-final-join/ledger.txt
          python3 scripts/m_census.py census >> target/k5-final-join/ledger.txt
          cargo run -q -p ql-cli --locked -- kernel validate-ledger --json > target/k5-final-join/validation.json
          cargo run -q -p ql-cli --locked -- kernel m1 fixtures/kernel/m1-engine-v1.request.json --json > target/k5-final-join/m1-frame.json
          git diff --exit-code
      - name: Verify identical clean product tree and publish only the K5 branch
        run: |
          set -euo pipefail
          cp .git/index "$RUNNER_TEMP/k5-clean-index"
          export GIT_INDEX_FILE="$RUNNER_TEMP/k5-clean-index"
          git rm --cached .github/workflows/k5-final-join.yml scripts/_k5_final_join.py
          clean=$(git write-tree)
          echo "$clean" > target/k5-final-join/clean-product-tree.txt
          test "$clean" = 03f274375b094ccc4bf5719377e35f974fa815f1
          unset GIT_INDEX_FILE
          test -z "$(git diff --cached --name-only HEAD -- .github/workflows)"
          git diff --cached --check
          git commit -m 'fix(m1): reconcile final engine with accepted M2 and preserve reviewed coverage'
          git rev-parse HEAD > target/k5-final-join/published-commit.txt
          git push origin HEAD:refs/heads/agent/129-m1-coordinate-rebuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-final-join-evidence-${{ github.sha }}
          path: target/k5-final-join/
          retention-days: 14
          if-no-files-found: error
