name: AW full source field
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aw-field-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-field:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: owners/Original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: 75ac68f4b3912908f55c1ef0f9031d35fc694d59
          path: owners/ai-kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Factory
          ref: c3c0677accdbeefb8e6cf1272cf45a9efa949873
          path: owners/Factory
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: 1dbd5150c0b264b2180bdf654cd944c59037ea24
          path: owners/QL-MEF
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 5fe7976f467096066692cda3c1018b73a88562df
          path: owners/Central
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 4af495f6509bb0dd779112a225d71a9df8145b6e
          path: owners/Actuation
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Workcell
          ref: e4e40a91fe7ed1776e634cad768f1049c39fd34e
          path: owners/Workcell
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Exact accepted subject and read-only source capture
        working-directory: subject
        run: |
          mkdir -p ../evidence
          git rev-parse HEAD > ../evidence/source-sha.txt
          git rev-parse HEAD^{tree} > ../evidence/source-tree.txt
          git cat-file commit HEAD > ../evidence/commit-object.txt
          git archive --format=tar HEAD | gzip -n > ../evidence/source.tar.gz
          rustc --version > ../evidence/toolchain.txt
      - name: Complete field, native blob pins and mutation regressions
        working-directory: subject
        run: |
          set -euo pipefail
          python3 scripts/aw0.py --verify-sources ../owners | tee ../evidence/field-counts.json
          python3 scripts/aw0.py --json > ../evidence/full-field.json
          python3 -m unittest discover -s scripts/tests -p test_aw0.py 2>&1 | tee ../evidence/field-tests.txt
          python3 scripts/check-capability-matrix-registry.py | tee ../evidence/registry.txt
          python3 scripts/check-pre-k8-lock.py | tee ../evidence/pre-k8.txt
          python3 scripts/check-ux-spine.py --self-test | tee ../evidence/ux-preservation.txt
      - name: Execute original property registry and compare full source payload
        working-directory: subject
        run: |
          set -euo pipefail
          python3 scripts/aw0-source-check.py ../owners/Original | tee ../evidence/original-registry.json
          for owner in Original ai-kit Factory QL-MEF Central Actuation Workcell; do
            test -z "$(git -C ../owners/$owner status --porcelain)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aw-field-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
