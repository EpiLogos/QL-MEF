name: Epi agent inventory refresh

on:
  push:
    branches: [epi-prime-ql-201-20260922]
    paths:
      - '.github/workflows/epi-agent-inventory-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epi-prime-ql-201-20260922
          fetch-depth: 1
      - name: Regenerate current source inventory
        run: |
          set -euo pipefail
          python3 scripts/k8-census.py --write-receipt
          python3 scripts/k8-census.py --check-receipt
      - name: Publish receipt and remove temporary helper
        run: |
          set -euo pipefail
          git config user.name "EpiLogos CI"
          git config user.email "actions@users.noreply.github.com"
          git add fixtures/kernel/k8-census-receipt-v1.json
          git rm .github/workflows/epi-agent-inventory-refresh.yml
          git commit -m "evidence(epi-agent): refresh K8 inventory after Nara binding"
          git push origin HEAD:epi-prime-ql-201-20260922
