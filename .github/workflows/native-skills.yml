name: Native Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/ql-service/**"
      - "crates/ql-adapters/**"
      - ".github/workflows/native-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/verify-native-skills.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - run: cargo test -p ql-adapters --test noql_matrix --locked
      - run: cargo test -p ql-adapters --test interop_contract --locked
