name: Native Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/ql-service/**"
      - "crates/ql-adapters/**"
      - ".github/workflows/native-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/verify-native-skills.sh"
      - "crates/ql-service/**"
      - "crates/ql-adapters/**"
      - ".github/workflows/native-skills.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-native-skills.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ql-adapters --test noql_matrix
      - run: cargo test -p ql-adapters --test interop_contract
      - run: cargo test --workspace --all-targets
