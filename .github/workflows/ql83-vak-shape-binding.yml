name: QL83 bind Vāk to canonical QL shapes

on:
  push:
    branches:
      - feat/epi-vak-agent-native-runtime
    paths:
      - '.github/workflows/ql83-vak-shape-binding.yml'

permissions:
  contents: write

jobs:
  implement-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/epi-vak-agent-native-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and verify Vāk shape binding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ql83-vak-shape-bind.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit returned binding and remove migration scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ql83-vak-shape-binding.yml scripts/ql83-vak-shape-bind.py
          git add crates/ql-mef/src/vak.rs crates/ql-mef/src/lib.rs crates/ql-mef/tests/vak_language.rs
          git commit -m '[QL83] Bind full Vāk operation field to canonical QL shapes'
          git push origin HEAD:feat/epi-vak-agent-native-runtime
