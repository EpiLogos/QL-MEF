name: QL-MEF Rust

# The one pull-request gate for Quaternal Logic. Product-local acceptance
# campaigns run from accepted main; sibling-repository checks are commissioned
# weekly by cross-product.yml. The required `ql-mef-rust` job below aggregates
# the Rust, native-C and deterministic-invariant offices so branch protection
# continues to name one stable check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'c/**'
              - 'cpp/**'
              - 'crates/**'
              - 'fixtures/kernel/**'
              - 'migration/epi-kernel/**'
              - 'vendor/epi-kernel/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ql-mef-rust.yml'

  core:
    name: core-rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The native acceptance gate verifies retained proofs against their
          # original Git objects and the explicitly qualified successor cut.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      # Nara's natal and current-sky tests run the real Kerykeion provider through uv.
      - uses: astral-sh/setup-uv@v6
      - name: Canonical Rust workspace and native CLI gate
        run: bash scripts/verify core
      - name: Retain deterministic decision corpus and baseline receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ql-agent-deterministic-${{ github.sha }}-${{ github.run_attempt }}
          path: target/agent-decision/native-corpus-*
          if-no-files-found: ignore
          retention-days: 14

  native:
    name: native-c
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    # Original1372 exceeded60min during full cold source replay; both required
    # workloads remained unreached. Keep every original gate and measure the
    # complete floor with stage timestamps. This is a coverage budget, not a
    # cold-reopen latency acceptance or a substitute for repairing actual cost.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Install native field transport development dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libjson-c-dev pkg-config
      - name: Native C/C++ parity, packaging and installed-consumer floor
        run: bash scripts/verify native
      - name: Retain physical-musical component evidence from the actual source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physical-musical-components-${{ github.sha }}
          path: target/physical-musical/
          if-no-files-found: ignore
          retention-days: 14

  invariants:
    name: repository-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, registry, census, skill and CI-topology locks
        run: bash scripts/verify invariants
      - name: Retain the actual current source inventory for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-inventory-${{ github.sha }}
          path: target/m-ledger/current/
          if-no-files-found: ignore
          retention-days: 14

  ql-mef-rust:
    name: ql-mef-rust
    if: always()
    needs: [changes, core, native, invariants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable native verification office
        env:
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          NATIVE: ${{ needs.native.result }}
          INVARIANTS: ${{ needs.invariants.result }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          test "$CORE" = success
          test "$INVARIANTS" = success
          case "$NATIVE" in success|skipped) ;; *) exit 1 ;; esac
          printf 'QL PR gate: core=%s native=%s invariants=%s\n' "$CORE" "$NATIVE" "$INVARIANTS"
