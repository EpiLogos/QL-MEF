name: QL-MEF Rust

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ql-mef-rust.yml"

permissions:
  contents: write

jobs:
  ql-mef-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Temporary #138 source integration in the native verification environment.
      # Never writes main; non-fast-forward pushes refuse concurrent changes.
      - name: Integrate and format the existing Vāk implementation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/ql-vak-cf-138'
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/vak138-integrate.py; then
            python tools/vak138-integrate.py
            rm tools/vak138-integrate.py
          fi
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates tools/vak138-integrate.py
            git commit -m 'feat(vak): integrate and format recursive composition operations'
            git push origin HEAD:agent/ql-vak-cf-138
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
