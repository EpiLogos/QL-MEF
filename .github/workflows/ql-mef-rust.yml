name: QL-MEF Rust

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "crates/**"
      - "fixtures/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ql-mef-rust.yml"

permissions:
  contents: write

jobs:
  ql-mef-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Development-only one-use source application; removed before final PR checks.
      - name: Apply and format reviewed Vāk repairs
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/ql-vak-cf-138'
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/vak138-review.py; then
            python tools/vak138-review.py
            rm tools/vak138-review.py
            cargo fmt --all
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates docs tools/vak138-review.py
            git commit -m 'fix(vak): retain generative sources and enable full-profile re-entry'
            git push origin HEAD:agent/ql-vak-cf-138
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
