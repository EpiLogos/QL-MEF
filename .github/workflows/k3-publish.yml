name: K3 publish tested implementation
on:
  push:
    branches: [agent/k3-m-ledger-matrix-lock]
    paths: [.github/workflows/k3-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/k3-m-ledger-matrix-lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply the checksum-verified implementation already prepared on this branch
        run: |
          python3 - <<'PY'
          import textwrap
          from pathlib import Path
          workflow = Path('.github/workflows/k3-materialize.yml').read_text()
          code = workflow.split("          python3 - <<'PY'\n", 1)[1].split('          PY\n', 1)[0]
          exec(compile(textwrap.dedent(code), 'checksum-verified-k3-materialization', 'exec'))
          PY
          python3 scripts/m-ledger.py refresh
          cargo fmt --all
          git add crates docs fixtures/kernel/m-ledger-v1.json fixtures/kernel/m-ledger-v1.schema.json scripts/m-ledger.py scripts/tests/test_m_ledger.py
          git config user.name 'Epii'
          git config user.email 'agent@epilogos.dev'
          git commit -m 'feat(kernel): implement versioned M ledger, matrix lock and native coverage (#127)'
          git push origin HEAD:agent/k3-m-ledger-matrix-lock
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
