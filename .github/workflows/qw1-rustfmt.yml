name: QW1 rustfmt

on:
  push:
    branches:
      - agent/qw1-okf-meta-wiki

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw1-okf-meta-wiki
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit format and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw1-rustfmt.yml
          git add crates/ql-wiki/src/lib.rs crates/ql-wiki/tests/meta_wiki.rs Cargo.toml
          git commit -m "style(#9): apply rustfmt to meta-wiki"
          git push origin HEAD:agent/qw1-okf-meta-wiki
