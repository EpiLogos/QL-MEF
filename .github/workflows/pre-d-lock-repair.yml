name: PRE-D Cargo lock repair

on:
  push:
    branches:
      - agent/epi-pre-d-main-convergence
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - '.github/workflows/pre-d-lock-repair.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lock from current manifests
        run: cargo generate-lockfile
      - name: Verify generated lock
        run: cargo test --workspace --all-targets --locked
      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: current-main-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
