name: QW4 contract fix

on:
  push:
    branches:
      - agent/qw4-second-wiki-proof

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw4-second-wiki-proof
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Export recognition, preserve provider provenance, add inverse meta navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/ql-wiki/src/lib.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('mod portal;\n', 'mod portal;\nmod recognition;\n', 1)
          marker = 'pub use refraction::{\n'
          export = '''pub use recognition::{\n    ExternalObservation, META_RECOGNITION_CONTRACT, MetaAmendmentCandidate,\n    RecognitionDecision, RecognitionError, RecognitionLedger, RecognitionState,\n    RecognisedMetaAmendment, apply_recognised_amendment,\n};\n'''
          assert marker in s
          s = s.replace(marker, export + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('crates/ql-wiki/src/recognition.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    pub observation_ref: String,\n    pub from_meta_ref: String,',
              '    pub observation_ref: String,\n    pub source_provider_ref: String,\n    pub source_target_ref: String,\n    pub from_meta_ref: String,',
              1,
          )
          s = s.replace(
              '            observation_ref: candidate.observation.observation_ref.clone(),\n            from_meta_ref:',
              '            observation_ref: candidate.observation.observation_ref.clone(),\n            source_provider_ref: candidate.observation.source_provider_ref.clone(),\n            source_target_ref: candidate.observation.source_target_ref.clone(),\n            from_meta_ref:',
              1,
          )
          old = '''    let refs = projection.canonical_refs();\n    for reference in [&amendment.from_meta_ref, &amendment.to_meta_ref] {\n        if !refs.contains(reference.as_str()) {\n            return Err(RecognitionError::MissingMetaRef(reference.clone()));\n        }\n    }\n'''
          new = '''    let refs = projection\n        .canonical_refs()\n        .into_iter()\n        .map(ToOwned::to_owned)\n        .collect::<std::collections::BTreeSet<_>>();\n    for reference in [&amendment.from_meta_ref, &amendment.to_meta_ref] {\n        if !refs.contains(reference) {\n            return Err(RecognitionError::MissingMetaRef(reference.clone()));\n        }\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('crates/ql-wiki/src/portal.rs')
          s = p.read_text(encoding='utf-8')
          marker = '''                for relation in self.projection.relations.iter().filter(|relation| {\n                    relation.from_ref == current\n                        && self.surface_of(&relation.to_ref) == MetaRouteSurface::Meta\n                }) {\n                    edges.push(MetaRouteStep {\n                        from_ref: current.into(),\n                        from_surface: MetaRouteSurface::Meta,\n                        to_ref: relation.to_ref.clone(),\n                        to_surface: MetaRouteSurface::Meta,\n                        relation: relation.relation.clone(),\n                        origin: relation.origin.clone(),\n                        binding_ref: None,\n                        provider_ref: None,\n                        from_revision: self.meta_revision(current),\n                        to_revision: self.meta_revision(&relation.to_ref),\n                        provenance: vec![],\n                        qualified_relation: true,\n                        semantic_equivalence_asserted: false,\n                    });\n                }\n'''
          inverse = marker + '''                // Incoming recognised/authored meta relations are also navigable.\n                // The inverse label denotes traversal direction only; it does not\n                // assert a new canonical semantic relation or symmetry law.\n                for relation in self.projection.relations.iter().filter(|relation| {\n                    relation.to_ref == current\n                        && self.surface_of(&relation.from_ref) == MetaRouteSurface::Meta\n                }) {\n                    edges.push(MetaRouteStep {\n                        from_ref: current.into(),\n                        from_surface: MetaRouteSurface::Meta,\n                        to_ref: relation.from_ref.clone(),\n                        to_surface: MetaRouteSurface::Meta,\n                        relation: format!("inverse:{}", relation.relation),\n                        origin: relation.origin.clone(),\n                        binding_ref: None,\n                        provider_ref: None,\n                        from_revision: self.meta_revision(current),\n                        to_revision: self.meta_revision(&relation.from_ref),\n                        provenance: vec![],\n                        qualified_relation: true,\n                        semantic_equivalence_asserted: false,\n                    });\n                }\n'''
          assert marker in s
          s = s.replace(marker, inverse, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('crates/ql-wiki/tests/second_wiki_conformance.rs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('use std::collections::{BTreeMap, BTreeSet};', 'use std::collections::BTreeSet;')
          s = s.replace('use serde_json::{Value, json};', 'use serde_json::json;')
          p.write_text(s, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw4-contract-fix.yml
          git add crates/ql-wiki
          git commit -m "feat(#12): enforce recognition boundary and reciprocal meta traversal"
          git push origin HEAD:agent/qw4-second-wiki-proof
