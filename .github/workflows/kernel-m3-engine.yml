name: M3 source / semantic parity

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m3-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Exact source and test-revision receipts
        run: |
          set -euo pipefail
          mkdir -p target/m3-source
          git rev-parse HEAD > target/m3-source/engine-source-revision.txt
          git rev-parse HEAD^{tree} > target/m3-source/engine-source-tree.txt
          git archive --format=tar HEAD > target/m3-source/source.tar
      # No map read in CI: the audit runs on the committed m3-domain projection.
      - name: M3 map projection and explicit semantic discrepancies
        run: |
          set -euo pipefail
          python3 scripts/m3-source-parity.py | tee target/m3-source/summary.json
      - name: Source, semantic mutation and canonical-ledger compatibility tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_m3_source_parity.py -v 2>&1 | tee target/m3-source/tests.txt
          python3 -m unittest discover -s scripts/tests -p test_m3_observation_parity.py -v 2>&1 | tee target/m3-source/observation-tests.txt
          python3 scripts/m-ledger.py check | tee target/m3-source/ledger-locks.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-source-parity-${{ github.sha }}
          path: target/m3-source/
          retention-days: 14
          if-no-files-found: error
