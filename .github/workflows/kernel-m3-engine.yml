name: M3 engine / clock transcription parity

on:
  pull_request:
    paths: ["c/**", "crates/**", "fixtures/kernel/**", "scripts/**", "docs/kernel-rebuild/**", "docs/KERNEL-M3-ENGINE-CONTRACT.md", ".github/workflows/kernel-m3-engine.yml"]
  push:
    branches: [main]
    paths: ["c/**", "crates/**", "fixtures/kernel/**", "scripts/**", "docs/kernel-rebuild/**", "docs/KERNEL-M3-ENGINE-CONTRACT.md", ".github/workflows/kernel-m3-engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          persist-credentials: false
          sparse-checkout: |
            Idea/Bimba/Map/datasets/mahamaya-deep
            Idea/Bimba/Seeds/M/M3'
            Idea/Bimba/Seeds/M/M4'/Legacy/plans/CLOCK-AND-NARA-SPECS
          path: reference
      - name: Preserve read-only K2 source authority
        run: |
          mkdir -p snapshot
          git -C reference rev-parse HEAD > snapshot/revision.txt
          tar -C reference -cf snapshot/bimba-source.tar Idea
      - uses: actions/upload-artifact@v4
        with:
          name: m3-bimba-source-daa660c
          path: snapshot/
          retention-days: 7
          if-no-files-found: error
  m3-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preserve the exact tracked source for reproducible parity review
        run: |
          mkdir -p target/m3-engine
          git rev-parse HEAD > target/m3-engine/source-revision.txt
          git rev-parse HEAD^{tree} > target/m3-engine/source-tree.txt
          git archive --format=tar HEAD > target/m3-engine/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: m3-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/m3-engine/source.tar
            target/m3-engine/source-revision.txt
            target/m3-engine/source-tree.txt
          retention-days: 7
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@stable
      - name: Full native M3 field and explicit clock/transcription parity
        run: |
          set -euo pipefail
          python3 scripts/m3-engine-parity.py 2>&1 | tee target/m3-engine/parity.txt
      - name: Workspace regressions and formatting
        run: |
          cargo test --workspace --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/m3-engine/*.json
            target/m3-engine/*.jsonl
            target/m3-engine/*.txt
          retention-days: 14
          if-no-files-found: error
