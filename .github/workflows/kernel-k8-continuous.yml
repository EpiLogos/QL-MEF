name: K8 continuous native field
on:
  pull_request:
    paths: ['adapters/retained-field/**', 'cpp/**', 'c/**', 'crates/**', 'providers/sky/**', 'scripts/test-k8-continuous.py', 'scripts/test-k8-host.py', 'scripts/test-k8-resource.py', 'scripts/tests/test_k8_resource.py', 'scripts/compare-k8-resource.py', '.github/workflows/kernel-k8-continuous.yml']
  push:
    branches: [main]
    paths: ['adapters/retained-field/**', 'cpp/**', 'c/**', 'crates/**', 'providers/sky/**', 'scripts/test-k8-continuous.py', 'scripts/test-k8-host.py', 'scripts/test-k8-resource.py', 'scripts/tests/test_k8_resource.py', 'scripts/compare-k8-resource.py', '.github/workflows/kernel-k8-continuous.yml']
permissions:
  contents: read
jobs:
  native-field:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Retain Rust 2024 formatted sources without changing tested HEAD
        run: |
          for path in crates/ql-mef/src/continuous/host.rs crates/ql-mef/src/bin/ql-field-host.rs crates/ql-mef/src/continuous/receipt.rs crates/ql-mef/src/continuous/receipt/tests.rs crates/ql-mef/src/continuous.rs crates/ql-mef/src/continuous/coupled.rs crates/ql-mef/src/continuous/personal.rs crates/ql-mef/src/nara.rs crates/ql-mef/examples/k8_field.rs crates/ql-mef/examples/k8_coupled.rs crates/ql-mef/examples/k8_personal.rs crates/ql-mef/examples/k8_vak_personal.rs crates/ql-mef/tests/k8_coupled.rs crates/ql-mef/tests/nara_personal_field.rs; do
            mkdir -p "target/k8-format/$(dirname "$path")"
            cp "$path" "target/k8-format/$path"
            rustfmt --edition 2024 --config skip_children=true "target/k8-format/$path"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: k8-formatted-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/k8-format/
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev
          python -m pip install -r providers/sky/requirements.txt
      - name: Build and install real native C/C++ consumer
        run: |
          mkdir -p target/k8-continuous
          set -o pipefail
          make -C cpp test install PREFIX="$PWD/target/k8-cpp" 2>&1 | tee target/k8-continuous/build.log
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Itarget/k8-cpp/include \
            cpp/tests/continuous_field.cpp target/k8-cpp/lib/libql-mef-c.a -lm -o target/k8-continuous/installed-test
          target/k8-continuous/installed-test > target/k8-continuous/installed.json
      - name: C++ sanitizer and analytic boundary acceptance
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Wall -Wextra -Werror -pedantic -Icpp/include -Ic/include \
            cpp/tests/continuous_field.cpp c/build/libql-mef-c.a -lm -o target/k8-continuous/sanitized-test
          target/k8-continuous/sanitized-test > target/k8-continuous/sanitized.json
      - name: Accepted Rust producer, actual sky, persistent native modes and clock
        run: |
          cargo build --locked -p ql-mef --example m2_engine
          set -o pipefail
          python scripts/test-k8-continuous.py target/k8-cpp/bin/ql-field-worker 2>&1 | tee target/k8-continuous/native-join.log
      - name: Receipt identity and transport failure admission
        run: |
          set -o pipefail
          cargo test --locked -p ql-mef continuous::receipt::tests 2>&1 | tee target/k8-continuous/transport-tests.log
          cargo test --locked -p ql-mef vak_profile::tests 2>&1 | tee target/k8-continuous/aw-profile-tests.log
      - name: Rust validated producer and persistent native control session
        run: |
          cargo run --locked -p ql-mef --example k8_field -- target/k8-cpp/bin/ql-field-worker \
            target/k8-continuous/basis.json target/k8-continuous/initial.json > target/k8-continuous/rust-session.jsonl
      - name: Complete native M1 M2 M3 event and persistent material adoption
        run: |
          cargo test --locked -p ql-mef --test k8_coupled
          cargo run --locked -p ql-mef --example k8_coupled -- target/k8-cpp/bin/ql-field-worker \
            target/k8-continuous/basis.json target/k8-continuous/initial.json target/k8-coupled
      - name: Both complete musical inputs on one installed material owner
        run: |
          cargo run --locked -p ql-mef --example k8_coupled -- target/k8-cpp/bin/ql-field-worker \
            target/k8-continuous/basis.json target/k8-continuous/initial.json target/k8-coupled-v2 v2
      - name: Subject-bound Nara reception on that installed owner
        run: |
          mkdir -p target/k8-personal
          cargo test --locked -p ql-mef --test nara_personal_field
          cargo run --locked -p ql-mef --example k8_personal -- target/k8-cpp/bin/ql-field-worker \
            target/k8-coupled-v2/input.json target/k8-personal
      - name: Fetch exact Factory Vāk owner read-only
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Factory
          ref: 63d4147dfcef4785047c97fbdda9cd12bb5e03df
          path: target/factory-source
          persist-credentials: false
      - name: Owner-executed Vāk through the same material and Nara owner
        run: |
          set -euo pipefail
          mkdir -p target/k8-factory target/k8-vak-personal
          FACTORY_SHA=$(git -C target/factory-source rev-parse HEAD)
          test "$FACTORY_SHA" = "63d4147dfcef4785047c97fbdda9cd12bb5e03df"
          printf '%s\n' "$FACTORY_SHA" > target/k8-factory/source-sha.txt
          (cd target/factory-source && cargo run -p epilogos-factory --example k8_vak_performance_receipt -- \
            "$GITHUB_WORKSPACE/target/k8-factory/vak-performance.json") \
            2>&1 | tee target/k8-factory/owner-execution.log
          FACTORY_RECEIPT_SHA=$(sha256sum target/k8-factory/vak-performance.json | awk '{print $1}')
          printf '%s  %s\n' "$FACTORY_RECEIPT_SHA" 'vak-performance.json' > target/k8-factory/vak-performance.sha256
          cargo run --locked -p ql-mef --example k8_vak_personal -- \
            target/k8-cpp/bin/ql-field-worker \
            target/k8-coupled-v2/input.json \
            target/k8-factory/vak-performance.json \
            "$FACTORY_SHA" \
            target/k8-vak-personal \
            "$FACTORY_RECEIPT_SHA"
      - name: Managed coupled native host, compact delivery and source inspection
        run: |
          mkdir -p target/k8-host target/k8-host-debug
          cargo build --locked -p ql-mef --bin ql-field-host
          cp target/debug/ql-field-host target/k8-host-debug/ql-field-host
          cargo build --locked --release -p ql-mef --bin ql-field-host
          install -m755 target/release/ql-field-host target/k8-cpp/bin/ql-field-host
          cp target/k8-cpp/bin/ql-field-host target/k8-host/ql-field-host
          set -o pipefail
          python scripts/test-k8-host.py target/k8-cpp/bin/ql-field-host target/k8-cpp/bin/ql-field-worker 2>&1 | tee target/k8-host/host-run.log
      - name: Dual-bus host identity, native continuation and exact replay
        run: |
          K8_COUPLED_DIR="$PWD/target/k8-coupled-v2" K8_HOST_OUT_DIR="$PWD/target/k8-host-v2" \
            python scripts/test-k8-host.py target/k8-cpp/bin/ql-field-host target/k8-cpp/bin/ql-field-worker
      - name: Bounded native resource, lifecycle and original replay measurement
        run: |
          python -m unittest discover -s scripts/tests -p test_k8_resource.py
          K8_COUPLED_DIR="$PWD/target/k8-coupled-v2" K8_RESOURCE_PROFILE=debug \
            K8_RESOURCE_HOST="$PWD/target/debug/ql-field-host" K8_RESOURCE_OUT_DIR="$PWD/target/k8-resource-debug" \
            python scripts/test-k8-resource.py
          K8_COUPLED_DIR="$PWD/target/k8-coupled-v2" K8_RESOURCE_PROFILE=release \
            K8_RESOURCE_REPLAY_HOST="$PWD/target/debug/ql-field-host" python scripts/test-k8-resource.py
          python scripts/compare-k8-resource.py target/k8-resource-debug/acceptance.json \
            target/k8-resource/acceptance.json target/k8-resource/comparison.json
      - name: Fetch the exact retained renderer read-only
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Point-Cloud-Demo
          ref: 040627d0ea40032fe7c7b8c98be9a246be9db7f6
          path: target/point-cloud-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audio cursor, ownership, queue and failure atomicity
        run: |
          mkdir -p target/k8-audio
          set -o pipefail
          node --test adapters/retained-field/native-audio.test.mjs adapters/retained-field/instrument-session.test.mjs 2>&1 | tee target/k8-audio/node-tests.tap
      - name: Bundle receiver with the actual retained GPU implementation
        run: |
          mkdir -p target/k8-web target/k8-gpu
          echo '{"private":true,"type":"module"}' > target/k8-web/package.json
          npm --prefix target/k8-web install --package-lock=false --ignore-scripts --save-exact three@0.186.0 esbuild@0.25.0
          ln -s target/k8-web/node_modules node_modules
          node_modules/.bin/esbuild adapters/retained-field/acceptance.ts --bundle --format=esm --outfile=target/k8-gpu/acceptance.js
          cp target/k8-coupled/frames.jsonl target/k8-gpu/
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          git -C target/point-cloud-source rev-parse HEAD > target/k8-gpu/renderer-source-sha.txt
          sha256sum adapters/retained-field/retained-field.mjs target/point-cloud-source/src/engine/GPGPUSimulator.ts > target/k8-gpu/source-sha256.txt
          npm --prefix target/k8-web ls --all --json > target/k8-gpu/npm-lock.json
      - name: Real WebGL integration, no reseed, density and context recovery
        run: python adapters/retained-field/test-browser.py
      - name: Actual native PCM through browser audio graph at 44.1 48 and 96 kHz
        run: |
          set -o pipefail
          python adapters/retained-field/test-audio-browser.py 2>&1 | tee target/k8-audio/browser-run.log
      - name: Managed native host into actual retained GPU and browser sound
        run: |
          set -o pipefail
          mkdir -p target/k8-instrument
          python adapters/retained-field/test-instrument-browser.py 2>&1 | tee target/k8-instrument/browser-run.log
      - name: Both musical inputs into the installed retained GPU and browser sound
        run: |
          K8_COUPLED_DIR="$PWD/target/k8-coupled-v2" K8_INSTRUMENT_OUT_DIR="$PWD/target/k8-instrument-v2" \
            python adapters/retained-field/test-instrument-browser.py
      - name: Exact source and toolchain receipt
        if: always()
        run: |
          mkdir -p target/k8-continuous target/k8-audio
          git rev-parse HEAD > target/k8-continuous/source-sha.txt
          git rev-parse 'HEAD^{tree}' > target/k8-continuous/source-tree.txt
          { uname -a; c++ --version; rustc --version; python --version; pkg-config --modversion json-c; } > target/k8-continuous/toolchain.txt
          python -m pip freeze > target/k8-continuous/python-lock.txt
          sha256sum adapters/retained-field/native-audio.mjs cpp/Makefile > target/k8-audio/installed-asset-sources.sha256
          sha256sum cpp/include/ql/continuous_field.hpp cpp/src/field_worker.cpp cpp/tests/continuous_field.cpp > target/k8-continuous/cpp-source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8-continuous-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/k8-continuous/
            target/k8-gpu/
            target/k8-coupled/
            target/k8-coupled-v2/
            target/k8-personal/
            target/k8-factory/
            target/k8-vak-personal/
            target/k8-audio/
            target/k8-host/
            target/k8-host-v2/
            target/k8-resource/
            target/k8-resource-debug/
            target/k8-host-debug/
            target/k8-instrument/
            target/k8-instrument-v2/
          retention-days: 14
          if-no-files-found: error