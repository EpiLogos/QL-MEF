name: Q4 Verify Marker

on:
  push:
    branches:
      - agent/rust-q4-client-adapters

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rust-q4-client-adapters
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Record verified source head
        run: |
          printf 'source_head=%s\ngates=format,check,clippy,test\nresult=passed\n' "$GITHUB_SHA" > fixtures/q4/verification.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fixtures/q4/verification.txt
          git commit -m 'test(q4): record verified Rust source head'
          git push origin HEAD:agent/rust-q4-client-adapters
