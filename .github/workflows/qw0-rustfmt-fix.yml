name: QW0 rustfmt fix

on:
  push:
    branches:
      - agent/qw0-wiki-structural-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qw0-wiki-structural-contract
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatted source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/qw0-rustfmt-fix.yml
          git add crates/ql-core/src/lib.rs crates/ql-core/src/structural.rs crates/ql-core/tests/wiki_structural_contract.rs
          git commit -m "style(#8): apply rustfmt to structural contract"
          git push origin HEAD:agent/qw0-wiki-structural-contract
