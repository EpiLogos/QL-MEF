name: Nara personal native regressions
# The canonical PR gate runs all ql-cli tests. This is a bounded diagnostic replay.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --all --check
      - run: cargo test --locked -p ql-cli --all-targets
      - run: cargo clippy --locked -p ql-cli --all-targets -- -D warnings
