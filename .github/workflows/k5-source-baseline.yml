name: K5 source baseline (branch-local)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-source-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve exact tracked source and baseline observations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/k5-baseline/revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/k5-baseline/source.tar.gz"
          cargo test -p ql-mef --locked 2>&1 | tee "$RUNNER_TEMP/k5-baseline/rust-tests.txt"
          make -C c 2>&1 | tee "$RUNNER_TEMP/k5-baseline/c-build.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-source-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/k5-baseline/
          retention-days: 3
          if-no-files-found: error
