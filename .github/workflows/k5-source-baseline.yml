name: K5 source baseline (branch-local)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-source-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: .source/epi
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Preserve exact tracked source and baseline observations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/k5-baseline/revision.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/k5-baseline/source.tar.gz"
          git -C .source/epi ls-tree -r --name-only HEAD > "$RUNNER_TEMP/k5-baseline/epi-paths.txt"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path('.source/epi')
          paths = subprocess.check_output(['git', '-C', str(root), 'ls-tree', '-r', '--name-only', 'HEAD'], text=True).splitlines()
          selected = [p for p in paths if p.startswith(('Idea/Bimba/Map/', 'Body/S/S0/portal-core/', 'Idea/Bimba/Seeds/')) or any(s in p for s in ('ANANDA-EXECUTABLE-SUBSTRATE', 'M1-ARCHITECTURE', 'M1-2-ANANDA', 'Spanda_Genesis', 'Paramasiva'))]
          out = Path(os.environ['RUNNER_TEMP']) / 'k5-baseline'
          (out / 'epi-selected-paths.txt').write_text('\n'.join(selected) + '\n')
          with (out / 'epi-m1-inputs.tar.gz').open('wb') as f:
              subprocess.run(['git', '-C', str(root), 'archive', '--format=tar.gz', 'HEAD', '--', *selected], stdout=f, check=True)
          PY
          cargo test -p ql-mef --locked 2>&1 | tee "$RUNNER_TEMP/k5-baseline/rust-tests.txt"
          make -C c 2>&1 | tee "$RUNNER_TEMP/k5-baseline/c-build.txt"
          rustc --version --verbose > "$RUNNER_TEMP/k5-baseline/compiler.txt"
          TOOLCHAIN=$(dirname "$(dirname "$(rustup which rustc)")")
          tar -C "$TOOLCHAIN" -czf "$RUNNER_TEMP/k5-baseline/rust-toolchain.tar.gz" bin lib
          tar -C "${CARGO_HOME:-$HOME/.cargo}" -czf "$RUNNER_TEMP/k5-baseline/cargo-registry.tar.gz" registry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-source-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/k5-baseline/
          retention-days: 3
          if-no-files-found: error
