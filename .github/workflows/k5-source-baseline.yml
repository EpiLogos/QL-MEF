name: K5 accepted deep return (branch-local)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-source-baseline.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: bb47ab9730f0ddadd4891666fb6f3e0a6d457330
          persist-credentials: false
      - name: Preserve exact tracked deep return
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-deep-return"
          git rev-parse HEAD > "$RUNNER_TEMP/k5-deep-return/revision.txt"
          git ls-tree -r --name-only HEAD > "$RUNNER_TEMP/k5-deep-return/paths.txt"
          git archive --format=tar.gz HEAD Body/S/S0/epi-lib Body/S/S0/portal-core Idea/Bimba/Map Idea/Bimba/Seeds > "$RUNNER_TEMP/k5-deep-return/source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: k5-accepted-deep-return-bb47ab9
          path: ${{ runner.temp }}/k5-deep-return/
          retention-days: 3
          if-no-files-found: error
