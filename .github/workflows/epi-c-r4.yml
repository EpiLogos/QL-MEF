name: Epi C R4 Holographic Kernel

on:
  pull_request:
    paths:
      - 'c/**'
      - 'fixtures/kernel/**'
      - 'migration/epi-kernel/r4-**'
      - 'scripts/test-epi-c-r4.sh'
      - 'vendor/epi-kernel/reference/**'
      - '.github/workflows/epi-c-r4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holographic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: R4 native kernel address/relation/MEF/CF parity and package seam
        run: scripts/test-epi-c-r4.sh
      - name: Keep accepted R1/R2 scalar parity green
        run: scripts/test-epi-c-parity.sh
