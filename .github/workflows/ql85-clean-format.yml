name: QL85 clean format fix

on:
  push:
    branches:
      - agent/85-ql-shape-algebra
    paths:
      - '.github/workflows/ql85-clean-format.yml'

permissions:
  contents: write

jobs:
  format-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/85-ql-shape-algebra
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and verify QL shape contract
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p ql-core
      - name: Commit clean branch result and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ql85-clean-format.yml
          git add crates/ql-core/src/lib.rs crates/ql-core/src/shape.rs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[QL85] Format and verify canonical shape algebra'
          git push origin HEAD:agent/85-ql-shape-algebra
