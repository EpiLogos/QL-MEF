name: M3 native engine parity
on:
  pull_request:
    paths: ['c/**', 'crates/**', 'fixtures/kernel/**', 'vendor/epi-kernel/**', 'migration/epi-kernel/k7-*', 'scripts/**', 'docs/KERNEL-M3-ENGINE-CONTRACT.md', '.github/workflows/m3-engine.yml']
  push:
    branches: [main]
    paths: ['c/**', 'crates/**', 'fixtures/kernel/**', 'vendor/epi-kernel/**', 'migration/epi-kernel/k7-*', 'scripts/**', 'docs/KERNEL-M3-ENGINE-CONTRACT.md', '.github/workflows/m3-engine.yml']
permissions:
  contents: read
jobs:
  m3-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      M3_SOURCE_ROOT: ${{ github.workspace }}/target/m3-bimba-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: target/m3-bimba-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Full source, native C/Rust and parent-consumer acceptance
        run: bash scripts/test-m3-acceptance.sh
      - name: Canonical K7 ledger and exact proof inputs
        run: python3 scripts/m3-ledger.py check
      - name: Workspace regressions and lint
        run: |
          cargo test --workspace --all-targets --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Exact source and tree receipt
        if: always()
        run: |
          mkdir -p target/m3-acceptance
          git rev-parse HEAD > target/m3-acceptance/source-revision.txt
          git rev-parse HEAD^{tree} > target/m3-acceptance/source-tree.txt
          git archive HEAD > target/m3-acceptance/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/m3-acceptance/
            target/m3-domain/*.jsonl
            target/m3-rust/*.jsonl
            target/m3-parent-consumer/handoff.json
            target/m3-parent-consumer/consumer.cpp
          retention-days: 14
          if-no-files-found: error
