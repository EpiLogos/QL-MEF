name: K5 exact-source publication (temporary)
on:
  push:
    branches: [agent/129-m1-coordinate-rebuild]
    paths: [.github/workflows/k5-finish-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m pip install jsonschema==4.25.1
      - name: Verify exact reviewed source bytes before execution
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k5-finish"
          python3 - <<'PY'
          import base64,hashlib,zlib,os
          from pathlib import Path
          chunks=[Path(f'.k5-transfer/part-{i}.b64').read_text().strip() for i in range(8)]
          # Repairs are confined to transfer transcription, not product source.
          corrections={1:[(4010,4011,'J','j')],2:[(3154,3238,'crV7u9tdmc8GbbKuRVFyAIIlzrf73WY/Oq6+t05mprPKpjMIu89CxoCdshdR759FD+7qa0EIoxTtuatCa34K',''),(3239,3250,'Jnit+eyquXc','')],3:[(4977,4978,'Y','')]}
          for i,changes in corrections.items():
              for start,end,old,new in reversed(changes):
                  assert chunks[i][start:end]==old
                  chunks[i]=chunks[i][:start]+new+chunks[i][end:]
          raw=zlib.decompress(base64.b64decode(''.join(chunks),validate=True))
          actual=hashlib.sha256(raw).hexdigest()
          assert actual=='e79d7db3a68922b05ce7de012f441a8742afa25cfde37c3c1ff32b3491847c66',actual
          out=Path(os.environ['RUNNER_TEMP'])/'k5-finish'
          (out/'source-transfer.json').write_bytes(raw)
          (out/'transfer-sha256.txt').write_text(actual+'\n')
          print('Exact local source payload verified:',actual)
          PY
      - name: Reconstruct the reviewed product tree over current accepted main
        run: |
          set -euo pipefail
          git checkout --detach 74c28d8dff899ec8dbbb020527809672e6d91e5e
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,os
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/'k5-finish/source-transfer.json').read_bytes())
          assert p['base']=='74c28d8dff899ec8dbbb020527809672e6d91e5e'
          assert p['old']=='28a2b781b9e9b96fc7ac47b159ab1dee1650fa04'
          assert p['tree']=='97e497fe8be2c8b8ffc8dcf6d4f2dae0c534031b'
          # The final local replay orders the same implementation records as
          # this deterministic reconstruction. No record or assessment changes.
          expected='c34e6c005e43458dc1d45497d4954bda580f6453'
          r=Path.cwd()
          def git(*args): return subprocess.check_output(['git',*args])
          def safe(path):
              assert not Path(path).is_absolute() and '..' not in Path(path).parts
              return r/path
          for path in p['original_paths']:
              if path=='fixtures/kernel/m-ledger-v1.json': continue
              target=safe(path);target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(git('show',f'{p["old"]}:{path}'))
          for patch in p['patches']:
              subprocess.run(['git','apply','--whitespace=nowarn','-'],input=patch.encode(),check=True)
          for path,text in p['files'].items():
              target=safe(path);target.parent.mkdir(parents=True,exist_ok=True);target.write_text(text)
          ledger=json.loads(git('show',p['base']+':fixtures/kernel/m-ledger-v1.json'))
          old=json.loads(git('show',p['old']+':fixtures/kernel/m-ledger-v1.json'))
          for key in ['rows','implementations','evidence','discrepancies']:
              have={v['id'] for v in ledger[key]}
              ledger[key]+=[v for v in old[key] if v['id'].startswith('k5-m1:') and v['id'] not in have]
          ledger['assessments'].update({k:v for k,v in old['assessments'].items() if k.startswith('k5-m1:')})
          Path('fixtures/kernel/m-ledger-v1.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          subprocess.run(['python3','scripts/generate-m1-source.py','--write'],check=True)
          exec(compile(p['reconcile'],'<reviewed-k5-ledger-return>','exec'),{'__name__':'__main__'})
          subprocess.run(['python3','scripts/m_census.py','census'],check=True)
          subprocess.run(['python3','scripts/m-ledger.py','check'],check=True)
          subprocess.run(['python3','scripts/check-m1-acceptance.py'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          actual=git('write-tree').decode().strip()
          assert actual==expected,(actual,expected)
          out=Path(os.environ['RUNNER_TEMP'])/'k5-finish'
          (out/'tested-tree.txt').write_text(actual+'\n')
          print('Exact final locally tested product tree:',actual)
          PY
      - name: Execute full workspace and native M1 acceptance
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/k5-finish"
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked 2>&1 | tee "$out/workspace-tests.txt"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$out/clippy.txt"
          python3 -m unittest discover -s scripts/tests -p test_m_ledger.py -v 2>&1 | tee "$out/python-ledger.txt"
          python3 -m unittest discover -s scripts/tests -p test_m_census.py -v 2>&1 | tee "$out/python-census.txt"
          bash scripts/test-m1-engine.sh 2>&1 | tee "$out/native-m1.txt"
          python3 scripts/m-ledger.py refresh
          python3 scripts/m_census.py census
          python3 scripts/check-m1-acceptance.py
          cargo run -q -p ql-cli --locked -- kernel validate-ledger --json > "$out/ledger-validation.json"
          cargo run -q -p ql-cli --locked -- kernel m1 fixtures/kernel/m1-engine-v1.request.json --json > "$out/m1-state.json"
          git diff --exit-code
          test "$(git write-tree)" = c34e6c005e43458dc1d45497d4954bda580f6453
      - name: Publish only the tested product to the existing K5 branch
        run: |
          set -euo pipefail
          branch=agent/129-m1-coordinate-rebuild
          remote_head=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          new=$(git commit-tree "$tree" -p "$GITHUB_SHA" -p 74c28d8dff899ec8dbbb020527809672e6d91e5e -m 'feat(m1): complete K4 coordinate rebuild and stable engine contract (#129)')
          git push origin "$new:refs/heads/$branch"
          printf '%s\n' "$new" > "$RUNNER_TEMP/k5-finish/published-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k5-finish-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/k5-finish/
            target/m1-state/
            target/m1-engine/
          retention-days: 14
          if-no-files-found: error
