name: Native C kernel

on:
  pull_request:
    paths:
      - "c/**"
      - "crates/**"
      - "fixtures/**"
      - "migration/epi-kernel/**"
      - "vendor/epi-kernel/**"
      - "scripts/**"
      - "docs/kernel-rebuild/**"
      - "docs/KERNEL-NATIVE-C-FOUNDATION.md"
      - ".github/workflows/kernel-native-c.yml"
  push:
    branches: [main]
    paths:
      - "c/**"
      - "crates/**"
      - "fixtures/**"
      - "migration/epi-kernel/**"
      - "vendor/epi-kernel/**"
      - "scripts/**"
      - "docs/kernel-rebuild/**"
      - "docs/KERNEL-NATIVE-C-FOUNDATION.md"
      - ".github/workflows/kernel-native-c.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ql-native-c:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact native source
        run: |
          mkdir -p target/kernel-native-c
          git rev-parse HEAD > target/kernel-native-c/source-revision.txt
          git ls-tree -r HEAD c fixtures/kernel vendor/epi-kernel migration/epi-kernel > target/kernel-native-c/source-objects.txt
          git archive --format=tar.gz --output=target/kernel-native-c/source.tar.gz HEAD
      - name: Primitive parity
        run: bash scripts/test-epi-c-parity.sh
      - name: Native kernel parity, install and package
        run: bash scripts/test-epi-c-r4.sh
      - name: Current Rust producer and contracts
        run: cargo test --workspace --all-targets --locked
      - name: Upload exact-source native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-native-c-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/kernel-native-c/
            target/epi-c-r4/*.txt
            c/dist/
          if-no-files-found: error
          retention-days: 14
