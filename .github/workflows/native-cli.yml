name: Native CLI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ql-cli/**"
      - ".oi/product.json"
      - ".github/workflows/native-cli.yml"
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ql-cli/**"
      - ".oi/product.json"
      - ".github/workflows/native-cli.yml"

jobs:
  native-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p ql-cli --all-targets --locked -- -D warnings
      - run: cargo test -p ql-cli --all-targets --locked
      - run: cargo run -p ql-cli --locked -- --version
      - run: cargo run -p ql-cli --locked -- capabilities --json
      - run: cargo run -p ql-cli --locked -- verify --json
