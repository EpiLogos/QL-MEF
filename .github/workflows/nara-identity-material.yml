name: Nara native identity material
on:
  pull_request:
    paths:
      - 'crates/ql-cli/src/nara_personal/**'
      - 'crates/ql-cli/tests/nara_practice_reference_reuse.rs'
      - '.github/workflows/nara-identity-material.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Actual native identity, practice and CLI behaviour
        run: |
          set -euo pipefail
          mkdir -p /tmp/nara-identity
          git rev-parse HEAD > /tmp/nara-identity/source-head.txt
          cargo test --locked -p ql-cli --all-targets 2>&1 | tee /tmp/nara-identity/tests.log
          cargo clippy --locked -p ql-cli --all-targets -- -D warnings 2>&1 | tee /tmp/nara-identity/clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nara-native-identity-${{ github.sha }}
          path: /tmp/nara-identity
          if-no-files-found: error
