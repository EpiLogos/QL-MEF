name: AW94 property formatter helper
on:
  pull_request:
    paths:
      - '.github/workflows/aw94-format-helper.yml'
permissions:
  contents: read
jobs:
  format:
    if: github.head_ref == 'agent/aw94-full-field'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Format property increment and retain exact source
        run: |
          set -euo pipefail
          cargo fmt --all
          mkdir -p formatter/crates/ql-mef/src/property formatter/crates/ql-mef/examples
          cp crates/ql-mef/src/property.rs formatter/crates/ql-mef/src/property.rs
          cp crates/ql-mef/src/property/model.rs formatter/crates/ql-mef/src/property/model.rs
          cp crates/ql-mef/src/property/tests.rs formatter/crates/ql-mef/src/property/tests.rs
          cp crates/ql-mef/examples/property_source_check.rs formatter/crates/ql-mef/examples/property_source_check.rs
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: aw94-formatted-properties-${{ github.event.pull_request.head.sha || github.sha }}
          path: formatter/
          retention-days: 2
