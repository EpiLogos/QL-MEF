name: Epi Vāk source parity

on:
  # The runtime branch feat/epi-vak-agent-native-runtime was merged and the
  # 109-node parity it auto-synced is materialised on main. The gate is now
  # read-only: it fails when the local map drifts from the authoritative
  # source instead of silently overwriting it.
  push:
    branches:
      - main
    paths:
      - 'data/epi-bimba-map/anuttara-language-map.md'
      - 'data/epi-bimba-map/anuttara-language-map.provenance.json'
      - '.github/workflows/epi-vak-source-parity.yml'
  pull_request:
    paths:
      - 'data/epi-bimba-map/anuttara-language-map.md'
      - 'data/epi-bimba-map/anuttara-language-map.provenance.json'
      - '.github/workflows/epi-vak-source-parity.yml'

permissions:
  contents: read

jobs:
  exact-source-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QL-MEF head
        uses: actions/checkout@v4

      - name: Check out authoritative Epi source revision
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Epi-Logos-C-Experiments
          ref: daa660cbc1b8c5da83828698665a753852cb0287
          path: epi-source

      - name: Prove exact source identity against the authoritative revision
        shell: bash
        run: |
          set -euo pipefail
          source_blob="$(git -C epi-source hash-object 'Idea/Bimba/Map/datasets/anuttara-deep/anuttara-language-map.md')"
          local_blob="$(git hash-object data/epi-bimba-map/anuttara-language-map.md)"
          rows="$(grep -c '^| `M0' data/epi-bimba-map/anuttara-language-map.md)"
          printf 'source_revision=%s\nsource_blob=%s\nlocal_blob=%s\nentries=%s\n' \
            'daa660cbc1b8c5da83828698665a753852cb0287' "$source_blob" "$local_blob" "$rows"
          test "$source_blob" = '22835042d4d2c4ba821c252bd4fbfe52f39712ef'
          test "$local_blob" = "$source_blob"
          test "$rows" = '109'

      - name: Prove the recorded provenance matches the measured parity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/epi-bimba-map/anuttara-language-map.md')
          rows = [line for line in path.read_text().splitlines() if line.startswith('| `M0')]
          assert len(rows) == 109, len(rows)
          provenance = json.loads(Path('data/epi-bimba-map/anuttara-language-map.provenance.json').read_text())
          expected = {
              'schema': 'ql-mef.epi-vak-source-provenance/v1',
              'source': {
                  'repository': 'EpiLogos/Epi-Logos-C-Experiments',
                  'revision': 'daa660cbc1b8c5da83828698665a753852cb0287',
                  'path': 'Idea/Bimba/Map/datasets/anuttara-deep/anuttara-language-map.md',
                  'git_blob_sha': '22835042d4d2c4ba821c252bd4fbfe52f39712ef',
              },
              'local': {
                  'path': 'data/epi-bimba-map/anuttara-language-map.md',
                  'git_blob_sha': '22835042d4d2c4ba821c252bd4fbfe52f39712ef',
              },
              'entry_count': 109,
              'authority': 'semantic-formal-source',
              'parity': 'exact-git-blob-identity',
          }
          assert provenance == expected, 'recorded provenance drifted from the measured parity'
          PY
